<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Demo interattiva — NaNoShift</title>
<style>
:root{--blue:#0057B7;--yellow:#FFD700;--navy:#102b4e;--ink:#18334f;--muted:#718198;--line:#e2e9f1;--bg:#f4f7fb;--pale:#edf5ff;--green:#16845b;--red:#b42318;--purple:#7254c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.demo-banner{background:#fff6cc;color:#665000;border-bottom:1px solid #f1dc7b;padding:9px 16px;text-align:center;font-size:12px;font-weight:800;letter-spacing:.02em}
header{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.brand{font-size:21px;font-weight:950;color:var(--blue);text-decoration:none;display:flex;gap:9px;align-items:center}.brand span span{color:#d3a900}.brand small{display:block;font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:800;text-transform:uppercase}
.header-actions{display:flex;gap:8px;align-items:center}.btn{border:0;background:var(--blue);color:#fff;padding:10px 14px;border-radius:10px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.yellow{background:var(--yellow);color:var(--navy)}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1440px;margin:auto;min-height:calc(100vh - 106px)}
aside{background:#fff;border-right:1px solid var(--line);padding:20px 13px;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}
.aside-title{font-size:10px;font-weight:900;color:#9aa8b8;letter-spacing:.13em;text-transform:uppercase;padding:10px 12px 6px}
.navbtn{width:100%;border:0;background:transparent;text-align:left;color:#50657d;padding:10px 12px;border-radius:10px;font-weight:750;display:flex;gap:11px;align-items:center;margin:2px 0}.navbtn .ico{width:21px;text-align:center;font-size:17px}.navbtn.active{background:var(--pale);color:var(--blue)}.navbtn:hover{background:#f3f7fc}
main{padding:26px;min-width:0}.page-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.eyebrow{color:var(--blue);font-weight:900;font-size:10px;letter-spacing:.13em;text-transform:uppercase}.page-head h1{margin:4px 0;font-size:27px;letter-spacing:-.7px;color:var(--navy)}.page-head p{margin:0;color:var(--muted);max-width:650px}
.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;margin:13px 0;box-shadow:0 4px 18px #18345b08}.panel h2{margin:0 0 12px;color:var(--navy);font-size:17px}.panel h3{margin:0 0 6px;color:var(--navy);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.stat .label{font-size:11px;color:var(--muted);font-weight:750}.stat strong{display:block;font-size:27px;color:var(--navy);line-height:1.2;margin:5px 0}.stat small{color:var(--muted)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row.spread{justify-content:space-between}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;border-radius:99px;padding:4px 9px;background:#eef4fb;color:#37536f;font-size:11px;font-weight:850}.pill.green{background:#e8f6ef;color:#146543}.pill.yellow{background:#fff5c9;color:#775d00}.pill.red{background:#fff0ef;color:#a1261d}.pill.blue{background:#e9f2ff;color:#145da8}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;margin-top:10px}table{border-collapse:collapse;width:100%;min-width:580px;font-size:12px}th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#f6f9fd;color:#62758c;font-size:10px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}
.field{display:grid;gap:5px;min-width:150px;flex:1}.field label{font-size:11px;color:var(--muted);font-weight:800}.field input,.field select{width:100%;border:1px solid #cfd9e5;border-radius:9px;padding:10px;background:#fff;color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}.tab{background:white;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-weight:800;color:#60738a}.tab.active{background:var(--pale);border-color:#bad2f0;color:var(--blue)}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(55px,1fr));gap:6px;margin-top:12px}.weekday{text-align:center;font-size:10px;color:#8391a3;font-weight:900;padding:4px}.datecell{background:#f7f9fc;border:1px solid #edf1f6;border-radius:9px;min-height:74px;padding:7px;text-align:left}.datecell .num{font-size:11px;color:#667a91;font-weight:850}.shift{display:block;margin-top:6px;border-radius:6px;padding:3px 4px;text-align:center;font-size:11px;font-weight:900;background:#e0efff;color:#145da8}.shift.P{background:#e7f0ff;color:#2767b3}.shift.G{background:#e4f5eb;color:#146543}.shift.N{background:#eeeaff;color:#674bb1}.shift.R{background:#fff3c3;color:#795e00}.datecell button{border:0;background:none;width:100%;padding:0;text-align:left}
.notice{padding:11px 13px;border-radius:10px;background:#edf6ff;color:#1c578c;margin:10px 0}.notice.warn{background:#fff7dc;color:#725700}.notice.ok{background:#e9f7ef;color:#146543}
.feature-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.feature{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.feature b{display:block;color:var(--navy);margin-bottom:4px}.feature span{color:var(--muted);font-size:12px}
.person{display:flex;align-items:center;gap:9px}.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#e9f2ff;color:var(--blue);font-weight:900;font-size:11px}.switch{display:flex;gap:8px;align-items:center;font-weight:700}.switch input{width:18px;height:18px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:11px;box-shadow:0 10px 30px #102b4e33;z-index:30;max-width:min(90vw,380px);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
footer{padding:22px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{position:sticky;top:68px;height:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow:auto;z-index:8}.aside-title{display:none}.navbtn{width:auto;white-space:nowrap;margin:0;padding:8px 10px}.navbtn .ico{width:auto}.navbtn span:last-child{font-size:12px}main{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){header{padding:0 12px;height:60px}.brand{font-size:18px}.brand small{font-size:8px}.header-actions .btn.alt{display:none}main{padding:13px}.page-head{display:block}.page-head .btn{margin-top:10px}.grid{gap:8px}.stat{padding:11px}.stat strong{font-size:23px}.grid.two,.feature-list{grid-template-columns:1fr}.calendar{gap:3px;grid-template-columns:repeat(7,minmax(36px,1fr))}.datecell{min-height:62px;padding:4px}.datecell .num{font-size:10px}.shift{font-size:9px;padding:2px}.panel{padding:13px}}
@media print{.demo-banner,header,aside,.noprint,footer,.btn,button,form{display:none!important}body{background:#fff}.shell{display:block;min-height:0}main{padding:0}.panel{box-shadow:none;border:0}.print-area{display:block!important}.print-area .tablewrap{overflow:visible}.print-area table{min-width:0;font-size:9px}.print-area th,.print-area td{padding:4px 3px}}
</style>
</head>
<body>
<div class="demo-banner">DEMO INTERATTIVA · DATI DI FANTASIA · NESSUNA INFORMAZIONE VIENE SALVATA O INVIATA</div>
<header><a class="brand" href="index.html">NaNo<span>Shift</span><small>Esplora il gestionale</small></a><div class="header-actions"><a class="btn alt" href="index.html">← Torna al sito</a><a class="btn yellow" href="accesso.html?registrati=1">Crea account</a></div></header>
<div class="shell">
<aside aria-label="Sezioni demo">
<div class="aside-title">Panoramica</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const people=[
 {id:"p1",name:"Giulia Demo",role:"Infermiera",tag:"Coordinatrice",initials:"GD"},
 {id:"p2",name:"Marco Esempio",role:"Infermiere",tag:"",initials:"ME"},
 {id:"p3",name:"Sara Fittizia",role:"OSS",tag:"",initials:"SF"},
 {id:"p4",name:"Luca Campione",role:"Infermiere",tag:"",initials:"LC"},
 {id:"p5",name:"Elena Prova",role:"Infermiera",tag:"",initials:"EP"}
];
const names=people.map(p=>p.name);
const codes=["M","P","N","R","G"];
const descriptions={M:"Mattina · 07:00–14:00",P:"Pomeriggio · 14:00–19:00",G:"Giornata · 07:00–19:00",N:"Notte · 19:00–07:00",R:"Riposo"};
const state={page:"home",month:new Date(2026,10,1),published:false,cv:true,push:true,availability:{},shifts:{},approvedMembers:[],unitRequest:false,swaps:[
 {id:1,who:"Marco Esempio",to:"Sara Fittizia",date:"12/11",from:"N",target:"M",status:"In attesa del collega"},
 {id:2,who:"Luca Campione",to:"Elena Prova",date:"18/11",from:"P",target:"P",status:"Da approvare"}
],members:[...people],groups:["Infermieristica","OSS","Notturnisti"],notifications:[{title:"Nuova richiesta di cambio turno",body:"Marco Esempio · 12 novembre",time:"09:42"},{title:"Disponibilità confermate",body:"4 persone hanno completato il mese",time:"Ieri"}],sites:[{name:"Clinica Demo",rate:25.5,model:"M · P · N"},{name:"Centro Esempio",rate:28,model:"M · G · N"}],docs:[{name:"Giulia Demo",type:"BLSD",expiry:"15/12/2026"},{name:"Marco Esempio",type:"Antincendio",expiry:"03/11/2026"},{name:"Sara Fittizia",type:"Iscrizione Ordine",expiry:"20/02/2027"}]};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2400);}
function pageHead(title,sub,action){return '<div class="page-head"><div><div class="eyebrow">NaNoShift · Demo interattiva</div><h1>'+title+'</h1><p>'+sub+'</p></div>'+(action||"")+'</div>';}
function panel(title,body,extra){return '<section class="panel">'+(title?'<h2>'+title+'</h2>':"")+body+(extra||"")+'</section>';}
function stat(label,value,desc){return '<div class="stat"><div class="label">'+label+'</div><strong>'+value+'</strong><small>'+desc+'</small></div>';}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join("")+'</tr></thead><tbody>'+rows.join("")+'</tbody></table></div>';}
function getShift(pid,day){const key=pid+"|"+day;if(state.shifts[key])return state.shifts[key];const n=new Date(day+"T12:00:00").getDate();const arr=["M","P","N","R","M","G","R","P","M","N","R","P","G","R"];return arr[(n+people.findIndex(p=>p.id===pid)*3)%arr.length];}
function iso(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
function monthLabel(){return state.month.toLocaleDateString("it-IT",{month:"long",year:"numeric"});}
function monthCalendar(pid,editable){const y=state.month.getFullYear(),m=state.month.getMonth(),first=new Date(y,m,1).getDay(),offset=(first+6)%7,days=new Date(y,m+1,0).getDate(),labels=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];let out=labels.map(x=>'<div class="weekday">'+x+'</div>').join("");for(let i=0;i<offset;i++)out+='<div></div>';for(let d=1;d<=days;d++){const date=iso(y,m,d),code=getShift(pid,date),av=state.availability[date]||"ANY";out+='<div class="datecell"><div class="num">'+d+'</div>'+(editable?'<button data-cycle="'+date+'" title="Tocca per cambiare turno">':'<div>')+'<span class="shift '+code+'">'+code+'</span>'+(editable?'</button>':'</div>')+'</div>';}return '<div class="calendar">'+out+'</div>';}
function profile(){return pageHead("Profilo personale","Esempio di area personale: dati account, mansione, tipologia di attività e preferenze.")+
panel("I miei dati",'<form id="profileform" class="grid two"><div class="field"><label>Nome e cognome</label><input id="profname" value="Giulia Demo"></div><div class="field"><label>Email dimostrativa</label><input value="giulia.demo@example.test" disabled></div><div class="field"><label>Professione</label><select id="profrole"><option>Infermiera</option><option>OSS</option><option>Medico</option><option>Fisioterapista</option></select></div><div class="field"><label>Tipo di attività</label><select id="profwork"><option>Dipendente</option><option>Libera professionista</option><option>Entrambi</option><option>Non lavoro attualmente</option></select></div><div class="field"><label>Compenso orario di riferimento (€)</label><input id="profrate" type="number" value="25.50" min="0" step=".01"></div><div class="field"><label>Telefono dimostrativo</label><input value="+39 333 000 0000" disabled></div><button class="btn" type="submit">Salva profilo demo</button></form>')+
panel("Preferenze",'<label class="switch"><input type="checkbox" checked> Mostra i turni nel riepilogo</label><label class="switch"><input type="checkbox" checked> Ricevi avvisi sulle scadenze</label><p class="muted">Le preferenze sono simulate e non vengono salvate.</p>');}
function home(){return pageHead("Il tuo lavoro, sotto controllo","Una panoramica immediata di turni, disponibilità, scadenze e attività del reparto.",'<button class="btn" data-go="calendar">Apri calendario →</button>')+
'<div class="grid">'+stat("Turni questo mese","18","126 ore programmate")+stat("Prossimo turno","Domani · 07:00","Mattina · Clinica Demo")+stat("Disponibilità inviate","100%","Novembre 2026")+stat("Richieste in corso",state.swaps.length,"Cambi turno")+'</div>'+
panel("Il calendario della settimana",'<div class="row spread"><b>2–8 novembre 2026</b><span class="pill green">Programmazione pubblicata</span></div>'+table(["Giorno","Lun 2","Mar 3","Mer 4","Gio 5","Ven 6","Sab 7","Dom 8"],['<tr><td>Giulia Demo</td>'+["M","P","N","R","M","R","R"].map(c=>'<td><span class="pill '+(c==="R"?"yellow":"blue")+'">'+c+'</span></td>').join("")+'</tr>']) )+
'<div class="feature-list">'+[['Calendario personale','Consulta e modifica la vista dei tuoi turni.'],['Pianificazione reparto','Disponibilità, copertura e pubblicazione.'],['Cambi turno','Richieste, accettazione e approvazione.'],['Documenti','CV, attestati e scadenze professionali.'],['Sedi e compensi','Modelli orari e simulazioni economiche.'],['Notifiche','Avvisi in-app e notifiche push.']].map(x=>'<div class="feature"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join("")+'</div>';}
function calendar(){return pageHead("Calendario personale","Visualizza il mese, i turni assegnati e le ore previste.",'<button class="btn alt" data-print>Stampa calendario</button>')+panel("Il mio calendario",'<div class="row spread"><div class="row"><button class="btn alt small" data-month="-1">←</button><b style="min-width:150px;text-align:center;text-transform:capitalize">'+monthLabel()+'</b><button class="btn alt small" data-month="1">→</button></div><span class="pill green">Turni pubblicati</span></div>'+monthCalendar("p1",true)+'<div class="muted" style="margin-top:10px">Tocca una cella per ciclare tra M, P, G, N, R e turno non assegnato. Modifiche solo dimostrative.</div>','<div class="row" style="margin-top:14px"><span class="pill blue">M Mattina</span><span class="pill blue">P Pomeriggio</span><span class="pill blue">G Giornata</span><span class="pill blue">N Notte</span><span class="pill yellow">R Riposo</span></div>')+
'<div class="grid two">'+stat("Ore programmate","126 h","Questo mese")+stat("Riposi","8","Questo mese")+'</div>';}
function availability(){const y=state.month.getFullYear(),m=state.month.getMonth(),days=new Date(y,m+1,0).getDate();let rows=[];for(let d=1;d<=days;d++){const date=iso(y,m,d),v=state.availability[date]||"ANY";rows.push('<tr><td>'+d+' '+state.month.toLocaleDateString("it-IT",{month:"long"})+'</td><td><select data-av="'+date+'"><option value="ANY" '+(v==="ANY"?"selected":"")+'>Indifferente</option><option value="M" '+(v==="M"?"selected":"")+'>Mattina</option><option value="P" '+(v==="P"?"selected":"")+'>Pomeriggio</option><option value="N" '+(v==="N"?"selected":"")+'>Notte</option><option value="R" '+(v==="R"?"selected":"")+'>Preferirei riposo</option><option value="X" '+(v==="X"?"selected":"")+'>Non disponibile</option></select></td></tr>');}return pageHead("Le mie disponibilità","Indica quando puoi lavorare e quali turni preferisci. In un account reale il coordinatore può confermare le disponibilità.")+panel("Disponibilità · "+monthLabel(),'<div class="notice">Imposta le preferenze giorno per giorno. In questa demo i valori restano solo nella pagina.</div>'+table(["Data","Preferenza"],rows)+'<div class="row" style="margin-top:12px"><button class="btn" data-save-av>Conferma disponibilità</button><button class="btn alt" data-av-all="ANY">Imposta tutto indifferente</button></div>');}
function ward(){const rows=people.map(p=>'<tr><td><div class="person"><span class="avatar">'+p.initials+'</span><span><b>'+p.name+'</b><br><small class="muted">'+p.role+'</small></span></div></td><td><span class="pill green">Attivo</span></td><td>'+p.tag+'</td><td><button class="btn alt small" data-message="'+p.id+'">Messaggio demo</button></td></tr>');return pageHead("Il reparto","Una vista condivisa del gruppo di lavoro, con turni pubblicati e informazioni essenziali.",'<span class="pill green">Clinica Demo · Attiva</span>')+panel("Personale del reparto",table(["Operatore","Stato","Ruolo","Azione"],rows))+panel("Turni pubblicati",'<div class="row spread"><b>Novembre 2026</b><span class="pill green">Pubblicato</span></div>'+table(["Operatore","2 Lun","3 Mar","4 Mer","5 Gio","6 Ven","7 Sab","8 Dom"],people.map(p=>'<tr><td>'+p.name+'</td>'+["M","P","N","R","M","R","R"].map((_,i)=>'<td><span class="pill '+(getShift(p.id,iso(2026,10,i+2))==="R"?"yellow":"blue")+'">'+getShift(p.id,iso(2026,10,i+2))+'</span></td>').join("")+'</tr>')));}
function coord(){const availCount=people.filter(p=>p.id!=="p1").length;const rows=people.map((p,i)=>{const approved=i!==4||state.approvedMembers.includes(p.id);return '<tr><td>'+p.name+'</td><td>'+p.role+'</td><td><span class="pill '+(approved?"green":"yellow")+'">'+(approved?"Approvato":"In attesa")+'</span></td><td><button class="btn alt small" data-member="'+p.id+'">'+(approved?"Dettagli":"Approva")+'</button></td></tr>';});return pageHead("Coordinamento","Gestisci il personale, raccogli le disponibilità, genera una bozza, controlla la copertura e pubblica il calendario.",'<button class="btn alt" data-print>Stampa turni</button>')+
'<div class="grid">'+stat("Operatori attivi","4","1 richiesta da approvare")+stat("Disponibilità","4/4","Novembre 2026")+stat("Copertura media","92%","Stima dimostrativa")+stat("Cambi da gestire",state.swaps.length,"Richieste aperte")+'</div>'+
panel("Gestione operatori",table(["Nome","Mansione","Stato","Azione"],rows))+
panel("Pianificazione turni",'<div class="notice">Flusso demo: raccogli le disponibilità → confermale → genera la bozza → controlla copertura e avvisi → pubblica.</div><div class="row"><button class="btn alt" data-confirm-av>Conferma disponibilità</button><button class="btn" data-generate>Genera turni dalle disponibilità</button><button class="btn alt" data-publish>'+(state.published?"Ritira pubblicazione":"Pubblica calendario")+'</button><button class="btn alt" data-print>Stampa planning</button></div><div id="planstatus" class="muted" style="margin-top:9px">'+(state.published?"Calendario pubblicato.":"Bozza non ancora pubblicata.")+'</div><form id="quickform" class="row" style="margin-top:13px"><div class="field"><label>Assegnazione rapida · persona</label><select id="quickperson">'+people.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join("")+'</select></div><div class="field"><label>Data</label><input id="quickdate" type="date" value="2026-11-25"></div><div class="field"><label>Turno</label><select id="quickcode"><option>M</option><option>P</option><option>G</option><option>N</option><option>R</option></select></div><button class="btn alt" type="submit">Assegna turno</button></form>')+
panel("Avvisi di pianificazione",'<ul class="muted"><li>Controlla il riposo dopo il turno notturno.</li><li>Verifica le giornate consecutive e le sovrapposizioni.</li><li>Confronta le assegnazioni con le preferenze e le indisponibilità.</li></ul>')+
panel("Copertura giornaliera",table(["Turno","Lun","Mar","Mer","Gio","Ven","Sab","Dom"],["M","P","G","N"].map(c=>'<tr><td><b>'+c+'</b></td>'+[3,4,3,4,3,2,2].map(n=>'<td>'+n+'</td>').join("")+'</tr>')));}
function swaps(){return pageHead("Cambi turno","Il collega può accettare o rifiutare la proposta; il coordinatore approva il cambio prima che il calendario venga aggiornato.")+
panel("Nuova richiesta",'<form id="swapform" class="row"><div class="field"><label>Il tuo turno</label><select id="swapfrom"><option value="p1">Giulia Demo · 12/11 · Notte</option><option value="p1b">Giulia Demo · 18/11 · Pomeriggio</option></select></div><div class="field"><label>Proponi a</label><select id="swapto">'+people.filter(p=>p.id!=="p1").map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join("")+'</select></div><button class="btn" type="submit">Invia richiesta demo</button></form>')+
panel("Richieste in corso",table(["Richiedente","Collega","Data","Turni","Stato","Azioni"],state.swaps.map(s=>'<tr><td>'+s.who+'</td><td>'+s.to+'</td><td>'+s.date+'</td><td>'+s.from+' ⇄ '+s.target+'</td><td><span class="pill yellow">'+s.status+'</span></td><td><button class="btn alt small" data-swap-accept="'+s.id+'">Accetta</button> <button class="btn alt small" data-swap-reject="'+s.id+'">Rifiuta</button></td></tr>')));}
function groups(){return pageHead("Gruppi e inviti","Organizza gruppi di lavoro, invita colleghi con un link personale e gestisci le richieste di accesso.")+
panel("I miei gruppi",'<div class="row">'+state.groups.map(g=>'<span class="pill blue">'+g+'</span>').join("")+'</div><form id="groupform" class="row" style="margin-top:14px"><div class="field"><label>Nuovo gruppo</label><input id="groupname" placeholder="Es. Weekend" required></div><button class="btn" type="submit">Crea gruppo</button></form>')+
panel("Invita un collega",'<form id="inviteform" class="row"><div class="field"><label>Nome del collega</label><input id="inviteName" required placeholder="Nome dimostrativo"></div><div class="field"><label>Ruolo</label><select id="inviteRole"><option>Infermiere</option><option>OSS</option></select></div><button class="btn" type="submit">Genera invito demo</button></form><div id="inviteout" class="muted" style="margin-top:9px">Link di invito simulato, non utilizzabile.</div>')+
panel("Richieste di adesione",table(["Persona","Ruolo","Stato"],['<tr><td>Elena Prova</td><td>Infermiera</td><td><span class="pill yellow">In attesa</span></td></tr>','<tr><td>Andrea Fittizio</td><td>OSS</td><td><span class="pill green">Approvato</span></td></tr>']))+
panel("Nuova struttura",'<p class="muted">Richiedi uno spazio separato. In un servizio reale l’attivazione avviene dopo l’approvazione del Master.</p><form id="unitform" class="row"><div class="field"><label>Nome struttura</label><input id="unitname" placeholder="Es. Poliambulatorio Demo" required></div><button class="btn" type="submit">Richiedi attivazione</button></form><div id="unitstatus" class="muted" style="margin-top:8px">'+(state.unitRequest?"Richiesta inviata · in attesa di approvazione Master.":"Nessuna richiesta inviata.")+'</div>');}
function sites(){return pageHead("Sedi e modelli","Configura sedi di lavoro e modelli di orario per adattare i turni alla tua organizzazione.")+
panel("Sedi configurate",table(["Sede","Compenso orario demo","Modello"],state.sites.map(s=>'<tr><td>'+s.name+'</td><td>€ '+s.rate.toFixed(2)+'</td><td>'+s.model+'</td></tr>'))+
'<form id="siteform" class="row" style="margin-top:14px"><div class="field"><label>Nome sede</label><input id="sitename" required></div><div class="field"><label>Compenso orario (€)</label><input id="siterate" type="number" min="0" step=".01" value="25"></div><div class="field"><label>Modello turni</label><select id="sitemodel"><option>M · P · N</option><option>M · P · G · N</option><option>12 ore · giorno/notte</option></select></div><button class="btn" type="submit">Aggiungi sede</button></form>')+
panel("Modelli di turno",'<div class="feature-list">'+[['M · Mattina','07:00–14:00 · 7 ore'],['P · Pomeriggio','14:00–19:00 · 5 ore'],['G · Giornata','07:00–19:00 · 12 ore'],['N · Notte','19:00–07:00 · 12 ore'],['R · Riposo','0 ore']].map(x=>'<div class="feature"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join("")+'</div>');}
function tax(){return pageHead("Simulatore compensi","Stima indicativa basata sulle ore e sulla tariffa inserite. Non è un calcolo fiscale, contributivo o una consulenza.")+
panel("Parametri della simulazione",'<div class="row"><div class="field"><label>Ore diurne</label><input id="dayhours" type="number" min="0" value="120"></div><div class="field"><label>Ore notturne</label><input id="nighthours" type="number" min="0" value="36"></div><div class="field"><label>Tariffa oraria (€)</label><input id="hourrate" type="number" min="0" step=".01" value="25.50"></div><div class="field"><label>Maggiorazione notte (%)</label><input id="nightbonus" type="number" min="0" value="20"></div><button class="btn" data-calc>Calcola stima</button></div><div id="taxresult" class="notice" style="margin-top:14px">Compenso lordo stimato: € 4.284,00. Valore illustrativo.</div>')+
panel("Cosa considera",'<ul class="muted"><li>Ore diurne × tariffa oraria.</li><li>Ore notturne × tariffa con maggiorazione inserita.</li><li>Non applica IRPEF, INPS, IVA, detrazioni o regimi fiscali.</li></ul>');}
function docs(){return pageHead("Documenti e scadenze","Gestisci le certificazioni professionali e scegli se condividere il CV con le persone autorizzate.")+
panel("Scadenze dimostrative",table(["Persona","Documento","Scadenza","Stato"],state.docs.map(d=>'<tr><td>'+d.name+'</td><td>'+d.type+'</td><td>'+d.expiry+'</td><td><span class="pill '+(d.expiry.startsWith("03/11")?"red":"green")+'">'+(d.expiry.startsWith("03/11")?"In scadenza":"Regolare")+'</span></td></tr>')))+
panel("Condivisione CV",'<div class="notice warn">Nella demo non viene caricato né condiviso alcun documento reale.</div><label class="switch"><input type="checkbox" id="cvshare" '+(state.cv?"checked":"")+'> Consenti la condivisione del CV con i coordinatori autorizzati</label><p class="muted">La scelta è dimostrativa e non viene salvata.</p><button class="btn alt" data-upload-demo>Simula caricamento attestato</button>')+
panel("CV condivisibile",table(["Documento","Proprietario","Visibilità"],['<tr><td>CV_Giulia_Demo.pdf</td><td>Giulia Demo</td><td><span class="pill '+(state.cv?"green":"yellow")+'">'+(state.cv?"Condivisione attiva":"Non condiviso")+'</span></td></tr>']));}
function notifications(){return pageHead("Centro notifiche","Raccogli gli aggiornamenti del reparto e scegli se attivare le notifiche push sul dispositivo.")+
panel("Preferenze",'<label class="switch"><input type="checkbox" id="pushswitch" '+(state.push?"checked":"")+'> Notifiche push attive (simulazione)</label><p class="muted">In un account reale il browser richiede il consenso del dispositivo. Qui non viene chiesto alcun permesso.</p>')+
panel("Notifiche recenti",state.notifications.map(n=>'<div class="item" style="padding:11px 0;border-bottom:1px solid var(--line)"><b>'+n.title+'</b><div class="muted">'+n.body+' · '+n.time+'</div></div>').join("")); }
function render(){document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));const pages={home,profile,calendar,availability,ward,coord,swaps,groups,sites,tax,docs,notifications};$("main").innerHTML=pages[state.page]();bind();}
function bind(){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 document.querySelectorAll("[data-month]").forEach(b=>b.onclick=()=>{state.month.setMonth(state.month.getMonth()+Number(b.dataset.month));render();});
 document.querySelectorAll("[data-cycle]").forEach(b=>b.onclick=()=>{const d=b.dataset.cycle,cur=getShift("p1",d),idx=codes.indexOf(cur);state.shifts["p1|"+d]=codes[(idx+1)%codes.length];render();});
 document.querySelectorAll("[data-av]").forEach(s=>s.onchange=()=>state.availability[s.dataset.av]=s.value);
 document.querySelectorAll("[data-av-all]").forEach(b=>b.onclick=()=>{state.availability={};render();toast("Preferenze aggiornate nella demo.");});
 document.querySelectorAll("[data-save-av]").forEach(b=>b.onclick=()=>toast("Disponibilità confermate (solo demo)."));
 document.querySelectorAll("[data-print]").forEach(b=>b.onclick=()=>window.print());
 document.querySelectorAll("[data-generate]").forEach(b=>b.onclick=()=>{people.forEach(p=>{for(let d=1;d<=30;d++){const date=iso(2026,10,d);state.shifts[p.id+"|"+date]=getShift(p.id,date);}});const x=$("planstatus");if(x)x.textContent="Bozza generata dalle disponibilità simulate. Controlla le coperture prima della pubblicazione.";toast("Bozza turni generata.");});
 document.querySelectorAll("[data-publish]").forEach(b=>b.onclick=()=>{state.published=!state.published;render();toast(state.published?"Calendario pubblicato nella demo.":"Pubblicazione ritirata nella demo.");});
 document.querySelectorAll("[data-member]").forEach(b=>b.onclick=()=>{if(b.textContent==="Approva"){state.approvedMembers.push(b.dataset.member);render();toast("Operatore approvato nella demo.");}else toast("Scheda dimostrativa del membro.");});
 document.querySelectorAll("[data-swap-accept]").forEach(b=>b.onclick=()=>{const s=state.swaps.find(x=>x.id===Number(b.dataset.swapAccept));if(s)s.status="Accettato dal collega · in attesa del coordinatore";render();toast("Risposta registrata nella demo.");});
 document.querySelectorAll("[data-swap-reject]").forEach(b=>b.onclick=()=>{const s=state.swaps.find(x=>x.id===Number(b.dataset.swapReject));if(s)s.status="Rifiutato";render();toast("Richiesta rifiutata nella demo.");});
 const pf=$("profileform");if(pf)pf.onsubmit=e=>{e.preventDefault();toast("Profilo aggiornato nella demo.");};
 const qf=$("quickform");if(qf)qf.onsubmit=e=>{e.preventDefault();state.shifts[$("quickperson").value+"|"+$("quickdate").value]=$("quickcode").value;toast("Turno assegnato nella demo.");};
 document.querySelectorAll("[data-confirm-av]").forEach(b=>b.onclick=()=>toast("Disponibilità confermate nella demo."));
 const uf=$("unitform");if(uf)uf.onsubmit=e=>{e.preventDefault();state.unitRequest=true;render();toast("Richiesta struttura inviata al Master (demo).");};
 const sf=$("swapform");if(sf)sf.onsubmit=e=>{e.preventDefault();const to=people.find(p=>p.id===$("swapto").value);state.swaps.push({id:Date.now(),who:"Giulia Demo",to:to.name,date:"24/11",from:"N",target:"M",status:"In attesa del collega"});render();toast("Richiesta demo inviata.");};
 const gf=$("groupform");if(gf)gf.onsubmit=e=>{e.preventDefault();const n=$("groupname").value.trim();if(n&&!state.groups.includes(n)){state.groups.push(n);render();toast("Gruppo creato nella demo.");}};
 const inf=$("inviteform");if(inf)inf.onsubmit=e=>{e.preventDefault();$("inviteout").innerHTML='<span class="pill green">Invito creato</span> '+esc($("inviteName").value)+' · <code>DEMO-'+Math.random().toString(36).slice(2,8).toUpperCase()+'</code> <small>(codice fittizio, non utilizzabile)</small>';};
 const sitef=$("siteform");if(sitef)sitef.onsubmit=e=>{e.preventDefault();state.sites.push({name:$("sitename").value,rate:Number($("siterate").value)||0,model:$("sitemodel").value});render();toast("Sede aggiunta nella demo.");};
 document.querySelectorAll("[data-calc]").forEach(b=>b.onclick=()=>{const day=Number($("dayhours").value)||0,night=Number($("nighthours").value)||0,rate=Number($("hourrate").value)||0,bonus=Number($("nightbonus").value)||0,total=day*rate+night*rate*(1+bonus/100);$("taxresult").textContent="Compenso lordo stimato: € "+total.toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2})+". Valore illustrativo.";});
 const cv=$("cvshare");if(cv)cv.onchange=()=>{state.cv=cv.checked;toast("Preferenza CV aggiornata nella demo.");};
 const pu=$("pushswitch");if(pu)pu.onchange=()=>{state.push=pu.checked;toast("Preferenza notifiche aggiornata nella demo.");};
 document.querySelectorAll("[data-upload-demo]").forEach(b=>b.onclick=()=>toast("Caricamento simulato: nessun file viene selezionato o inviato."));
 document.querySelectorAll("[data-message]").forEach(b=>b.onclick=()=>toast("Messaggio dimostrativo: nessun contatto reale."));
}
function go(p){state.page=p;render();window.scrollTo({top:0,behavior:"smooth"});}
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>go(b.dataset.page));
render();
})();
</script>
</body></html>
