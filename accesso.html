<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb"><title>NaNoShift · Accedi</title><link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png"><link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><style>
:root{color-scheme:light;--navy:#102b4e;--blue:#1769c2;--gold:#f2bd36;--ink:#19324e;--muted:#718198;--line:#dce5ef;--bg:#f3f6fa;--red:#b42318;--green:#16845b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:30px 16px;background:linear-gradient(145deg,#edf4fb,#f8f9fb 55%,#fff8e8);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
a{color:var(--blue)}button,input{font:inherit}.shell{width:min(100%,480px)}.brand{text-align:center;margin-bottom:20px}.mark{display:block;width:min(100%,360px);height:auto;object-fit:contain;margin:0 auto 9px;border-radius:0;background:transparent}.brand-name{font-size:clamp(2rem,5vw,2.4rem);font-weight:900;letter-spacing:-.06em;color:var(--navy)}.brand-name span{color:var(--blue)}.tagline{margin:6px 0 0;color:var(--muted);font-size:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:27px;box-shadow:0 18px 55px #17324f12}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;gap:5px;background:#edf3fb;border:1px solid var(--line);border-radius:12px}.tab{border:0;background:transparent;border-radius:10px;padding:12px 10px;font-weight:800;color:var(--muted);cursor:pointer}.tab[aria-selected="true"]{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(16,43,78,.08)}.field{margin-top:15px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input{width:100%;height:46px;padding:10px 12px;border:1px solid #cfdbe8;border-radius:10px;background:#fff;color:var(--ink);outline:none}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(23,105,194,.12)}.password-wrap{position:relative}.password-wrap input{padding-right:42px}.toggle-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}.toggle-eye:hover{background:#f1f5fb}.hint{font-size:12px;color:var(--muted);margin:7px 0 0}.requirements{display:grid;gap:5px;margin:10px 0 0;padding:11px 12px;border:1px solid #e5ebf2;border-radius:10px;background:#fafbfd}.req{font-size:12px;color:var(--muted)}.req.ok{color:var(--green);font-weight:700}.primary{width:100%;margin-top:22px;border:0;border-radius:11px;padding:13px 16px;background:var(--navy);color:#fff;font:inherit;font-weight:800;cursor:pointer}.primary:hover{background:#17416f}.primary:disabled{opacity:.7;cursor:wait}.links{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}.link{background:none;border:0;padding:0;color:var(--blue);font-weight:700;cursor:pointer}.message{margin-top:16px;padding:11px 12px;border-radius:10px;font-size:13px;display:none}.message.show{display:block}.message.info{background:#eef5ff;color:#1453a6;border:1px solid #cfe0ff}.message.error{background:#fff1f1;color:#a92825;border:1px solid #f4d4d2}.message.success{background:#edf9f4;color:#0f6d4c;border:1px solid #d3efdf}.foot{margin-top:18px;text-align:center;color:var(--muted);font-size:12px}.hidden{display:none!important}@media(max-width:520px){body{padding:18px 12px}.card{padding:21px}.brand{margin-bottom:15px}}
</style></head><body><main class="shell">
<header class="brand"><img class="mark" src="nanoshift-logo.png" alt="NaNoShift — I tuoi turni, sempre con te"><div class="brand-name">NaNo<span>Shift</span></div><p class="tagline">I tuoi turni, il tuo reparto e la tua organizzazione</p></header>
<section class="card" aria-label="Accesso e registrazione">
<div class="tabs" role="tablist"><button class="tab" id="loginTab" type="button" role="tab" aria-selected="true">Accedi</button><button class="tab" id="signupTab" type="button" role="tab" aria-selected="false">Registrati</button></div>
<form id="authForm" novalidate>
<div id="nameWrap" hidden><div class="field"><label for="firstName">Nome</label><input id="firstName" autocomplete="given-name" maxlength="60" placeholder="Il tuo nome"></div><div class="field"><label for="lastName">Cognome</label><input id="lastName" autocomplete="family-name" maxlength="60" placeholder="Il tuo cognome"></div></div>
<div class="field"><label for="email">Indirizzo email</label><input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="nome@esempio.it"></div>
<div class="field" id="passwordWrap"><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="Inserisci la password"><button class="toggle-eye" type="button" data-eye="password" aria-label="Mostra password">👁</button></div></div>
<div id="passwordRules" class="requirements" hidden><div class="req" data-rule="length">Almeno 8 caratteri</div><div class="req" data-rule="upper">Una lettera maiuscola</div><div class="req" data-rule="lower">Una lettera minuscola</div><div class="req" data-rule="number">Un numero</div></div>
<div class="field" id="confirmWrap" hidden><label for="confirmPassword">Conferma password</label><div class="password-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" maxlength="128" placeholder="Ripeti la password"><button class="toggle-eye" type="button" data-eye="confirmPassword" aria-label="Mostra password">👁</button></div></div>
<button class="primary" id="submitBtn" type="submit">Accedi</button>
</form>
<div class="links"><button class="link" id="forgotLink" type="button">Hai dimenticato la password?</button><button class="link" id="backToLogin" type="button" hidden>Torna all'accesso</button></div>
<div id="message" class="message" role="status" aria-live="polite"></div>
</section><p class="foot">Accesso riservato · Non inserire dati clinici dei pazienti</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script>
const SUPABASE_URL="https://mmkdibdomjaxwqfryqcw.supabase.co",SUPABASE_KEY="sb_publishable_QPArC4ARilfFLqxnNsV72A_UBzZN-5g",APP_URL="https://nanoshift.pages.dev";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id),form=$("authForm"),email=$("email"),password=$("password"),confirmPassword=$("confirmPassword"),submit=$("submitBtn"),message=$("message");
let mode="login",recoveryMode=false;
function msg(t,type="info"){message.textContent=t;message.className="message show "+type}
function clearMsg(){message.textContent="";message.className="message"}
function passwordChecks(v){return {length:v.length>=8,upper:/[A-Z]/.test(v),lower:/[a-z]/.test(v),number:/[0-9]/.test(v)}}
function updateRules(){const c=passwordChecks(password.value);Object.entries(c).forEach(([k,ok])=>document.querySelector('[data-rule="'+k+'"]').classList.toggle("ok",ok));const same=confirmPassword.value && password.value===confirmPassword.value;document.querySelector('[data-rule="length"]').classList.toggle("ok", c.length);if(confirmPassword.value){confirmPassword.setCustomValidity(same?"":"Le password non coincidono");confirmPassword.reportValidity();}}
function setMode(next){mode=next;recoveryMode=false;$("loginTab").hidden=false;$("signupTab").hidden=false;$("loginTab").setAttribute("aria-selected",String(next==="login"));$("signupTab").setAttribute("aria-selected",String(next==="signup"));$("nameWrap").hidden=next!=="signup";$("confirmWrap").hidden=next!=="signup";$("passwordRules").hidden=next!=="signup";$("submitBtn").textContent=next==="signup"?"Registrati":"Accedi";$("backToLogin").hidden=!recoveryMode&&(next==="login");$("forgotLink").hidden=recoveryMode;}
document.querySelectorAll("[data-eye]").forEach(b=>b.addEventListener("click",()=>{const el=$(b.dataset.eye),show=el.type==="password";el.type=show?"text":"password";b.setAttribute("aria-label",show?"Nascondi password":"Mostra password")}));
password.addEventListener("input",updateRules);confirmPassword.addEventListener("input",updateRules);
$("loginTab").onclick=()=>setMode("login");$("signupTab").onclick=()=>setMode("signup");$("backToLogin").onclick=()=>setMode("login");
$("forgotLink").onclick=async()=>{clearMsg();const address=email.value.trim().toLowerCase();if(!address){msg("Inserisci prima il tuo indirizzo email.","error");email.focus();return}try{recoveryMode=true;setMode("login");const {error}=await sb.auth.resetPasswordForEmail(address,{redirectTo:location.origin+location.pathname+"?reset=1"});if(error)throw error;msg("Controlla la tua email: ti abbiamo inviato il link per reimpostare la password.","success")}catch(e){msg(e.message||"Si è verificato un errore.","error");recoveryMode=false;setMode("login");}};
form.addEventListener("submit",async e=>{e.preventDefault();clearMsg();submit.disabled=true;try{
const address=email.value.trim().toLowerCase(),pass=password.value;
if(recoveryMode){if(!Object.values(passwordChecks(pass)).every(Boolean))throw Error("La nuova password non rispetta tutti i requisiti.");if(pass!==confirmPassword.value)throw Error("Le password non coincidono.");const {error}=await sb.auth.updateUser({password:pass});if(error)throw error;msg("Password aggiornata correttamente.","success");recoveryMode=false;setMode("login");return}
if(mode==="signup"){if(!$("firstName").value.trim()||!$("lastName").value.trim())throw Error("Inserisci nome e cognome.");if(!Object.values(passwordChecks(pass)).every(Boolean))throw Error("La password deve contenere almeno 8 caratteri, una maiuscola, una minuscola e un numero.");if(pass!==confirmPassword.value)throw Error("Le password non coincidono.");const {data, error}=await sb.auth.signUp({email:address,password:pass,options:{data:{first_name:$("firstName").value.trim(),last_name:$("lastName").value.trim(),display_name:$("firstName").value.trim()+" "+$("lastName").value.trim()}}});if(error)throw error;msg("Registrazione completata. Controlla la tua email per confermare l’account.","success");return}
if(mode==="login"){if(!address||!pass)throw Error("Inserisci email e password.");const {data,error}=await sb.auth.signInWithPassword({email:address,password:pass});if(error)throw error;const target=await nextUrl();if(target){window.location.href=target}else{window.location.href="dashboard.html";}}
}catch(e){msg(e.message||"Si è verificato un errore. Riprova.","error")}finally{submit.disabled=false}});
async function nextUrl(){
const q=new URLSearchParams(location.search);
if(q.has("unit_invite"))return"reparto.html?unit_invite="+encodeURIComponent(q.get("unit_invite"));
try{
 const {data:{user},error:userErr}=await sb.auth.getUser();
 if(userErr||!user)return"dashboard.html";
 const {data:profile,error:profileErr}=await sb.from("profiles").select("role").eq("id",user.id).maybeSingle();
 const role=(profile&&profile.role)?profile.role:"user";
 const {data:memberships,error:membershipErr}=await sb.rpc("get_my_units");
 const coord=(memberships||[]).some(m=>m.unit_role==="coordinator"&&m.status==="active");
 const teamMember=(memberships||[]).some(m=>m.status==="active"&&(m.unit_role==="nurse"||m.unit_role==="coordinator"));
 if(role==="admin"||role==="nurse_coordinator"||coord)return"coordinamento.html";
 if(teamMember)return"reparto.html";
 return"dashboard.html";
}catch(_){return"dashboard.html";}
}
(async()=>{const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.replace(/^#/,"));if(params.get("error_description")||hash.get("error_description")){msg("Il login non è andato a buon fine. Controlla i dettagli dell’errore e riprova.","error")}else if(params.get("reset")==="1"){msg("Inserisci la nuova password per completare il reset.","info");recoveryMode=true;setMode("login");const pw=$("password");pw.value="";const c=$("confirmPassword");if(c)c.value="";$("passwordRules").hidden=false;$("confirmWrap").hidden=false;$("submitBtn").textContent="Aggiorna password";}
if(params.get("invite") || params.get("unit_invite")){const target="reparto.html"+(params.get("unit_invite")?"?unit_invite="+encodeURIComponent(params.get("unit_invite")):"");window.location.replace(target);return}
const {data:{session}}=await sb.auth.getSession();if(session){const target=await nextUrl();window.location.replace(target);}})();
</script></body></html>
