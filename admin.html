<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb"><title>NaNoShift · Amministrazione</title><style>
:root{--navy:#10284b;--blue:#2463eb;--pale:#edf3ff;--line:#dfe6f1;--muted:#68778f;--red:#b42318}body.has-nav .wrap{max-width:1100px}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#19324e;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 15px}.top,.panel,.user{background:#fff;border:1px solid #dce5ef;border-radius:15px;padding:18px;margin-bottom:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 12px}.muted{color:#718198}.btn{border:0;border-radius:9px;background:#102b4e;color:white;padding:10px 13px;font-weight:700;cursor:pointer}.btn.secondary{background:#edf3f9;color:#102b4e}input,select{padding:9px;border:1px solid #cfdbe8;border-radius:8px;font:inherit}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.users{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.user{margin:0}.user h3{margin:0 0 3px;font-size:16px}.user small{display:block;color:#718198}.rolebox{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}.status{padding:10px 0;color:#1769c2}
</style><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="nav.css"></head><body><nav class="side-nav" id="sideNav" aria-label="Navigazione"></nav><main class="wrap"><header class="top"><div><h1>Utenti e ruoli</h1><div class="muted">Registrazioni, accessi e autorizzazioni</div></div><div id="headerAccount"></div></header><section class="panel"><div class="row"><button id="refresh" class="btn">Aggiorna elenco</button><input id="filter" placeholder="Cerca nome o email"><span id="count" class="muted"></span></div><div id="status" class="status">Verifica account…</div></section><div id="users" class="users"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script src="nav.js"></script><script>
const sb=window.supabase.createClient("https://mmkdibdomjaxwqfryqcw.supabase.co","sb_publishable_QPArC4ARilfFLqxnNsV72A_UBzZN-5g");const $=id=>document.getElementById(id);let allUsers=[],units=[];
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function status(s,bad=false){$("status").textContent=s;$("status").style.color=bad?"#b42318":"#1769c2"}
async function call(action,extra={}){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error("Sessione scaduta");const res=await fetch("https://mmkdibdomjaxwqfryqcw.supabase.co/functions/v1/nanoshift-admin",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,apikey:"sb_publishable_QPArC4ARilfFLqxnNsV72A_UBzZN-5g","Content-Type":"application/json"},body:JSON.stringify({action,...extra})});const data=await res.json();if(!res.ok)throw Error(data.error||"Operazione non riuscita");return data}
async function initNav(user){try{const nv=await NanoNav.loadContext(sb,user);NanoNav.render({container:$("sideNav"),page:"admin",prefs:nv.prefs,ctx:nv.ctx,account:{name:nv.profile.display_name||nv.profile.first_name||user.email,avatar:nv.profile.avatar_url,onLogout:async()=>{await sb.auth.signOut();location.href="accesso.html"}}});NanoNav.mountAccount($("headerAccount"),{sb,user,profile:nv.profile})}catch(e){console.error(e)}}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href="accesso.html";return}initNav(session.user);if(session.user.email?.toLowerCase()==="nanoshift01@gmail.com"){try{const {data:p}=await sb.from("profiles").select("role").eq("id",session.user.id).single();if(p?.role!=="admin"){status("Primo accesso amministratore: inizializzazione protetta…");await call("bootstrap_admin");status("Account amministratore inizializzato.");}}catch(e){status(e.message,true);return}}await load()}
async function load(){try{const data=await call("list_users");allUsers=data.users||[];units=data.units||[];render();status("Elenco aggiornato.")}catch(e){status(e.message,true)}}
function render(){const q=$("filter").value.toLowerCase();const rows=allUsers.filter(u=>(u.display_name+" "+u.email+" "+u.profession).toLowerCase().includes(q));$("count").textContent=rows.length+" utenti";$("users").innerHTML=rows.map(u=>'<article class="user"><h3>'+esc(u.display_name||[u.first_name,u.last_name].filter(Boolean).join(" ")||"Utente")+'</h3><small>'+esc(u.email)+'</small><small>Registrato: '+(u.created_at?new Date(u.created_at).toLocaleDateString("it-IT"):"—")+'</small><small>Ultimo accesso: '+(u.last_sign_in_at?new Date(u.last_sign_in_at).toLocaleString("it-IT"):"Mai registrato")+'</small><small>Email verificata: '+(u.email_confirmed?"Sì":"No")+'</small><div class="rolebox"><label>Ruolo generale</label><select data-global="'+u.id+'"><option value="nurse" '+(u.role==="nurse"?"selected":"")+'>Utente</option><option value="admin" '+(u.role==="admin"?"selected":"")+'>Admin</option></select><button class="btn secondary" data-save-global="'+u.id+'">Salva</button></div><div class="rolebox"><label>Ruolo reparto</label><select data-unit="'+u.id+'"><option value="">Seleziona reparto</option>'+units.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select><select data-unit-role="'+u.id+'"><option value="nurse">Utente</option><option value="coordinator">Coordinatore</option></select><button class="btn secondary" data-save-unit="'+u.id+'">Assegna</button></div><small>Reparti: '+(u.unit_memberships||[]).map(m=>esc(m.unit_name)+" ("+(m.unit_role==="coordinator"?"coordinatore":"utente")+")").join(", ")+'</small></article>').join("")||'<p class="muted">Nessun utente trovato.</p>';
document.querySelectorAll("[data-save-global]").forEach(b=>b.onclick=async()=>{const id=b.dataset.saveGlobal,role=document.querySelector('[data-global="'+id+'"]').value;try{await call("set_global_role",{user_id:id,role});status("Ruolo aggiornato.");await load()}catch(e){status(e.message,true)}});
document.querySelectorAll("[data-save-unit]").forEach(b=>b.onclick=async()=>{const id=b.dataset.saveUnit,unit_id=document.querySelector('[data-unit="'+id+'"]').value,role=document.querySelector('[data-unit-role="'+id+'"]').value;if(!unit_id){status("Seleziona un reparto.",true);return}try{await call("set_unit_role",{user_id:id,unit_id,role});status("Ruolo reparto aggiornato.");await load()}catch(e){status(e.message,true)}})}
$("refresh").onclick=load;$("filter").oninput=render;init();
</script></body></html>
