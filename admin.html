<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb"><title>NaNoShift · Amministrazione</title><style>
:root{--navy:#10284b;--blue:#2463eb;--pale:#edf3ff;--line:#dfe6f1;--muted:#68778f;--red:#b42318}body.has-nav .wrap{max-width:1100px}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#19324e;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 15px}.top,.panel,.user{background:#fff;border:1px solid #dce5ef;border-radius:15px;padding:18px;margin-bottom:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 12px}.muted{color:#718198}.btn{border:0;border-radius:9px;background:#102b4e;color:white;padding:10px 13px;font-weight:700;cursor:pointer}.btn.secondary{background:#edf3f9;color:#102b4e}input,select{padding:9px;border:1px solid #cfdbe8;border-radius:8px;font:inherit}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.users{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.user{margin:0}.user h3{margin:0 0 3px;font-size:16px}.user small{display:block;color:#718198}.rolebox{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}.status{padding:10px 0;color:#1769c2}
.tabhdr{margin:0 0 4px}.sub{color:#718198;margin:0 0 14px}.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #e8eef6}.kv:last-child{border-bottom:0}
.pillst{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800}.st-approved{background:#e6f6ee;color:#146543}.st-pending{background:#fff4d6;color:#8a5a00}.st-rejected{background:#fde8e6;color:#b42318}
</style><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="nav.css"></head><body><nav class="side-nav" id="sideNav" aria-label="Navigazione"></nav><main class="wrap"><header class="top"><div><h1 id="pageTitle">Panoramica</h1><div class="muted" id="pageSub">Dati di insieme della piattaforma</div></div><div id="headerAccount"></div></header><div id="status" class="status" role="status">Verifica account…</div><div id="view"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script src="nav.js"></script><script>
const sb=window.supabase.createClient("https://mmkdibdomjaxwqfryqcw.supabase.co","sb_publishable_QPArC4ARilfFLqxnNsV72A_UBzZN-5g");const $=id=>document.getElementById(id);
let allUsers=[],pendingUnits=[],unitStats=null,statsErr="",tab="overview",navBase=null,filterText="";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function status(s,bad=false){$("status").textContent=s;$("status").style.color=bad?"#b42318":"#1769c2"}
async function call(action,extra={}){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error("Sessione scaduta");const res=await fetch("https://mmkdibdomjaxwqfryqcw.supabase.co/functions/v1/nanoshift-admin",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,apikey:"sb_publishable_QPArC4ARilfFLqxnNsV72A_UBzZN-5g","Content-Type":"application/json"},body:JSON.stringify({action,...extra})});const data=await res.json();if(!res.ok)throw Error(data.error||"Operazione non riuscita");return data}
const TITLES={overview:["Panoramica","Dati di insieme della piattaforma"],units:["Strutture","Reparti attivi, richieste e numeri"],accounts:["Account","Registrazioni, accessi e autorizzazioni"]};
function renderSide(){if(!navBase)return;const items=NanoNav.MASTER_TABS.map(i=>({...i,badge:i.id==="units"&&pendingUnits.length?pendingUnits.length:""}));NanoNav.render({...navBase,customItems:items,active:tab,primary:4,onTab:t=>{tab=t;render()},onHome:()=>{tab="overview";render()}})}
async function initNav(user){try{const nv=await NanoNav.loadContext(sb,user);navBase={container:$("sideNav"),page:"admin",prefs:nv.prefs,ctx:nv.ctx,account:{name:nv.profile.display_name||nv.profile.first_name||user.email,avatar:nv.profile.avatar_url,onLogout:async()=>{await sb.auth.signOut();location.href="accesso.html"}}};renderSide();NanoNav.mountAccount($("headerAccount"),{sb,user,profile:nv.profile})}catch(e){console.error(e)}}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href="accesso.html";return}initNav(session.user);if(session.user.email?.toLowerCase()==="nanoshift01@gmail.com"){try{const {data:p}=await sb.from("profiles").select("role").eq("id",session.user.id).single();if(p?.role!=="admin"){status("Primo accesso amministratore: inizializzazione protetta…");await call("bootstrap_admin");status("Account amministratore inizializzato.");}}catch(e){status(e.message,true);return}}await load()}
async function load(){
 try{
  const [data,requests]=await Promise.all([call("list_users"),call("list_units")]);
  allUsers=data.users||[];pendingUnits=requests.units||[];
  try{const st=await call("unit_stats");unitStats=st.units||[];statsErr=""}catch(e){unitStats=null;statsErr=e.message}
  status("Aggiornato alle "+new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})+".");render();
 }catch(e){status(e.message,true)}
}
const day=86400000,ago=d=>Date.now()-d*day;
function statCard(n,l,warn){return '<div class="statcard'+(warn?" warn":"")+'"><b>'+n+'</b><span>'+l+'</span></div>'}
function overviewView(){
 const u=allUsers,n=u.length;
 const new7=u.filter(x=>x.created_at&&new Date(x.created_at)>ago(7)).length,new30=u.filter(x=>x.created_at&&new Date(x.created_at)>ago(30)).length;
 const act7=u.filter(x=>x.last_sign_in_at&&new Date(x.last_sign_in_at)>ago(7)).length,act30=u.filter(x=>x.last_sign_in_at&&new Date(x.last_sign_in_at)>ago(30)).length;
 const unv=u.filter(x=>!x.email_confirmed).length,adm=u.filter(x=>x.role==="admin").length;
 const us=unitStats||[],ap=us.filter(x=>x.approval_status==="approved"),members=ap.reduce((s,x)=>s+x.active,0);
 let h='<section class="statgrid">'+statCard(n,"account registrati")+statCard(new30,"nuovi negli ultimi 30 giorni")+statCard(act7,"attivi negli ultimi 7 giorni")+statCard(pendingUnits.length,"strutture in attesa di approvazione",pendingUnits.length>0)+'</section>';
 h+='<section class="panel"><h2>Utenti</h2><div class="kv"><span>Nuovi negli ultimi 7 giorni</span><b>'+new7+'</b></div><div class="kv"><span>Accessi negli ultimi 30 giorni</span><b>'+act30+'</b></div><div class="kv"><span>Email non ancora verificata</span><b>'+unv+'</b></div><div class="kv"><span>Amministratori</span><b>'+adm+'</b></div></section>';
 h+='<section class="panel"><h2>Strutture</h2>'+(unitStats?'<div class="kv"><span>Approvate</span><b>'+ap.length+'</b></div><div class="kv"><span>In attesa</span><b>'+us.filter(x=>x.approval_status==="pending").length+'</b></div><div class="kv"><span>Rifiutate</span><b>'+us.filter(x=>x.approval_status==="rejected").length+'</b></div><div class="kv"><span>Persone attive nei reparti</span><b>'+members+'</b></div><div class="kv"><span>Media persone per reparto</span><b>'+(ap.length?(members/ap.length).toFixed(1).replace(".",","):"–")+'</b></div>':'<p class="muted">Statistiche delle strutture non ancora disponibili'+(statsErr?" ("+esc(statsErr)+")":"")+'. Serve aggiornare la funzione di amministrazione.</p>')+'</section>';
 h+='<section class="panel"><h2>Privacy</h2><p class="muted" style="margin:0">Questo account vede gli account registrati (email, date di accesso, ruolo) e numeri aggregati delle strutture. Turni, disponibilità, documenti e dati dei reparti non sono accessibili.</p></section>';
 return h;
}
function unitsView(){
 const rows=unitStats?unitStats.slice():pendingUnits.map(x=>({...x,approval_status:"pending",active:0,pending:0,coordinators:0}));
 const lab={approved:"Attiva",pending:"In attesa",rejected:"Rifiutata"};
 return '<section class="panel"><h2>Strutture ('+rows.length+')</h2>'+(unitStats?"":'<p class="muted">Mostro solo le richieste in attesa: i numeri per reparto richiedono la funzione di amministrazione aggiornata.</p>')+(rows.map(x=>'<article class="user"><h3>'+esc(x.name)+' <span class="pillst st-'+x.approval_status+'">'+lab[x.approval_status]+'</span></h3><small>Creata il '+new Date(x.created_at).toLocaleDateString("it-IT")+(unitStats?' · '+x.active+' persone attive · '+x.coordinators+' coordinamento · '+x.pending+' richieste di ingresso':'')+'</small>'+(x.approval_status==="pending"?'<div class="rolebox"><button class="btn" data-approve="'+x.id+'">Approva struttura</button><button class="btn secondary" data-reject="'+x.id+'">Rifiuta</button></div>':'')+'</article>').join("")||'<p class="muted">Nessuna struttura.</p>')+'</section>';
}
function accountsView(){
 const q=filterText.toLowerCase(),rows=allUsers.filter(u=>((u.email||"")+" "+(u.id||"")).toLowerCase().includes(q));
 return '<section class="panel"><div class="row"><input id="filter" placeholder="Cerca per email" value="'+esc(filterText)+'"><span class="muted">'+rows.length+' account</span></div></section><div class="users">'+(rows.map(u=>'<article class="user"><h3>'+esc(u.email||("Account · "+u.id.slice(-8).toUpperCase()))+'</h3><small>Registrato: '+(u.created_at?new Date(u.created_at).toLocaleDateString("it-IT"):"—")+'</small><small>Ultimo accesso: '+(u.last_sign_in_at?new Date(u.last_sign_in_at).toLocaleString("it-IT"):"Mai registrato")+'</small><small>Email verificata: '+(u.email_confirmed?"Sì":"No")+'</small><div class="rolebox"><label>Ruolo generale</label><select data-global="'+u.id+'"><option value="nurse" '+(u.role==="nurse"?"selected":"")+'>Utente</option><option value="admin" '+(u.role==="admin"?"selected":"")+'>Admin</option></select><button class="btn secondary" data-save-global="'+u.id+'">Salva</button></div></article>').join("")||'<p class="muted">Nessun account trovato.</p>')+'</div>';
}
function render(){
 const t=TITLES[tab];$("pageTitle").textContent=t[0];$("pageSub").textContent=t[1];
 $("view").innerHTML=tab==="units"?unitsView():tab==="accounts"?accountsView():overviewView();
 renderSide();
 document.querySelectorAll("[data-approve],[data-reject]").forEach(b=>b.onclick=async()=>{const decision=b.hasAttribute("data-approve")?"approve":"reject";if(!confirm(decision==="approve"?"Attivare questa struttura?":"Rifiutare questa richiesta?"))return;try{await call("review_unit",{unit_id:b.dataset.approve||b.dataset.reject,decision});status(decision==="approve"?"Struttura approvata.":"Richiesta rifiutata.");await load()}catch(e){status(e.message,true)}});
 document.querySelectorAll("[data-save-global]").forEach(b=>b.onclick=async()=>{const id=b.dataset.saveGlobal,role=document.querySelector('[data-global="'+id+'"]').value;try{await call("set_global_role",{user_id:id,role});status("Ruolo aggiornato.");await load()}catch(e){status(e.message,true)}});
 const f=$("filter");if(f)f.oninput=()=>{filterText=f.value;const pos=f.selectionStart;render();const nf=$("filter");nf.focus();nf.setSelectionRange(pos,pos)};
}
init();
</script></body></html>
