<style>
:root{--navy:#10284b;--blue:#2463eb;--pale:#edf3ff;--bg:#f5f7fc;--line:#dfe6f1;--muted:#68778f;--red:#b42318;--green:#13845b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px max(16px,calc((100% - 1280px)/2));background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;color:#0057B7}.brand img{width:220px;height:auto;max-height:66px;object-fit:contain}
.links{display:flex;gap:8px;flex-wrap:wrap}.links a{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--navy);text-decoration:none;font-weight:650;font-size:14px}

h1{margin:0 0 4px;font-size:clamp(22px,4vw,29px);letter-spacing:-.4px}h2{margin:0 0 8px;font-size:18px}
.muted{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 4px 18px #18345b08}
.btn{border:0;border-radius:11px;background:var(--blue);color:#fff;padding:9px 14px;font-weight:700}.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.danger{background:#fff0ef;color:var(--red);border:1px solid #f4cfcc}.btn.small{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.5;cursor:default}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #ccd6e4;border-radius:10px;background:#fff;color:var(--navy)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.row .field{flex:1;min-width:180px}
.notice{padding:11px 13px;border-radius:10px;background:#eaf7f0;color:#146543;margin:12px 0}.notice.error{background:#fff0ef;color:var(--red)}.notice.warn{background:#fff8e6;color:#7a5200}
.tabs{display:flex;gap:7px;margin:14px 0 0;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:650}.tabs button.active{background:var(--pale);border-color:#b9cdfb;color:var(--blue)}
.badge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:#d92d20;color:#fff;font-size:11px;font-weight:800;text-align:center;margin-left:5px;padding:0 4px}
.code{display:inline-block;font:800 20px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;background:var(--pale);color:var(--blue);padding:8px 12px;border-radius:10px}
.monthnav{display:flex;align-items:center;gap:8px;margin:14px 0 6px;flex-wrap:wrap}.monthnav strong{min-width:150px;text-align:center;text-transform:capitalize}.monthnav button.nav{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.item:last-child{border-bottom:0}
.scroll{overflow:auto;max-height:72vh;margin-top:8px;border:1px solid var(--line);border-radius:12px}table{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;min-width:32px;height:32px}
th{position:sticky;top:0;background:#f8faff;z-index:2;font-size:11px;color:var(--muted);line-height:1.1}th.we{color:var(--red)}
th:first-child,td:first-child{position:sticky;left:0;background:#fff;text-align:left;min-width:128px;padding:0 8px;font-weight:700;z-index:3;white-space:nowrap}th:first-child{z-index:4;background:#f8faff}th.totalcol,td.totalcol{position:sticky;right:0;z-index:3;background:#f1f5fc;min-width:94px;padding:3px 6px;font-weight:800}th.totalcol{z-index:4;background:#e8eef9}.summarycell{font-size:11px;white-space:nowrap}.summarycell small{font-weight:500;color:var(--muted)}
td.cov{font-weight:700;color:var(--navy);background:#fafcff}td.cov.zero{color:#b8c2d3;font-weight:400}tr.covrow td:first-child{font-weight:600;color:var(--muted)}
.cell{width:100%;height:32px;border:0;background:transparent;font-weight:800;color:var(--navy);padding:0}.cell:hover{background:var(--pale)}
.cell.unav{background:#fff0ef}.cell.rest{background:#f1ecfc}.cell.warn{outline:2px solid #d92d20;outline-offset:-2px}
.pill{display:inline-block;min-width:22px;padding:2px 5px;border-radius:6px;color:#fff;font-weight:800;font-size:12px}.M{background:#c58a12}.P{background:#3478d4}.G{background:#13845b}.N{background:#7754c8}.R{background:#fff4bf;color:#0755b7;border:1px solid #0057b7}
td.a{font-weight:800;font-size:12px}td.a.free{background:#e8f6ef;color:var(--green)}td.a.M,td.a.P,td.a.G,td.a.N{color:#fff}td.a.rest{background:#7754c8;color:#fff}td.a.unavailable{background:#d92d20;color:#fff}td.a.none{color:#c1cada}td.a.conf{box-shadow:inset 0 -3px 0 var(--green)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0}.legend span{display:inline-flex;align-items:center;gap:4px}
.warnlist{margin:10px 0 0;padding:0;list-style:none;font-size:13px}.warnlist li{padding:4px 0;color:var(--red)}
dialog{border:0;border-radius:18px;width:min(420px,calc(100% - 24px));padding:20px;box-shadow:0 20px 80px #14294d33}dialog::backdrop{background:#0b1f3d77}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.opts button{padding:12px 4px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:800}.opts button.on{border-color:var(--blue);background:var(--pale);color:var(--blue)}
.printonly{display:none}
/* Responsive polish: coordinatore */
@media(max-width:700px){.top{align-items:flex-start;flex-direction:column;padding:12px}.brand{font-size:15px;flex-wrap:wrap}.brand img{width:124px;max-height:38px}.links{width:100%}.links a{flex:1;text-align:center;font-size:13px;padding:8px 7px}.wrap{padding:12px 10px 36px}.panel{padding:12px;border-radius:13px}.scroll{max-height:65vh}th:first-child,td:first-child{min-width:108px}.monthnav strong{min-width:125px}.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cov.short{background:#fee4e2!important;color:#b42318;font-weight:800}

<header class="top"><div class="brand"><img class="logo-mark" src="favicon-192.png" alt=""><span class="brand-text"><span class="brand-name">NaNo<span class="brand-shift">Shift</span></span><small>Area coordinamento</small></span></div><div id="headerAccount"></div></header>
<main class="wrap" id="app"><div class="panel">Caricamento…</div></main>

<script>
const SUPABASE_URL="https://mmkdibdomjaxwqfryqcw.supabase.co";
const SUPABASE_KEY="sb_publishable_QPArC4ARilfFLqxnNsV72A_UBzZN-5g";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD=["Dom","Lun","Mar","Mer","Gio","Ven","Sab"],WORK=["M","P","G","N"];
const PREF_TXT={ANY:"Libero",M:"Preferisce M",P:"Preferisce P",G:"Preferisce G",N:"Preferisce N",R:"Vorrebbe riposo",OFF:"Non disponibile"};
const PREF_SYM={ANY:"L",M:"M",P:"P",G:"G",N:"N",R:"Ri",OFF:"✕"};
const PREF_CLS={ANY:"free",M:"M",P:"P",G:"G",N:"N",R:"rest",OFF:"unavailable"};
let user=null,units=[],unit=null,roster=[],av={},as={},swapRequests=[],expiryRows=[],tab="home",cursor=new Date(),msg=null,monthPub=false;
cursor.setDate(1);
const ymd=(y,m,d)=>y+"-"+pad(m+1)+"-"+pad(d);
const keyOf=t=>ymd(t.getFullYear(),t.getMonth(),t.getDate());
const dim=()=>new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate();
const range=()=>[ymd(cursor.getFullYear(),cursor.getMonth(),1),ymd(cursor.getFullYear(),cursor.getMonth(),dim())];
const recalcPub=()=>{const f=range()[0],r=Object.values(as).filter(x=>x.day>=f);monthPub=r.length>0&&r.every(x=>x.published)};
const roleLabel=r=>r==='oss'?'OSS':'Infermiere';
const roleChip=r=>'<span class="rolechip '+(r==='oss'?'oss':'inf')+'">'+roleLabel(r)+'</span>';
let invites=[],leaves=[];
const approved=()=>roster.filter(m=>m.status==="active");
const nurses=()=>roster.filter(m=>m.status==="active"&&(m.unit_role==="nurse"||m.user_id===user?.id));
const pending=()=>roster.filter(m=>m.status==="pending"&&m.unit_role==="nurse");
const note=(t,type="")=>{msg=t?{t,type}:null};
async function init(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){location.href="accesso.html";return}
 user=session.user;
 const nv=await NanoNav.loadContext(sb,user);
 NanoNav.render({container:$("sideNav"),page:"coordinamento",prefs:nv.prefs,ctx:nv.ctx,account:{name:nv.profile.display_name||nv.profile.first_name||user.email,avatar:nv.profile.avatar_url,onLogout:async()=>{await sb.auth.signOut();location.href="accesso.html"}}});
 NanoNav.mountAccount($("headerAccount"),{sb,user,profile:nv.profile});
 const {data:profile}=await sb.from("profiles").select("role").eq("id",user.id).single();
 // Accesso per ruolo globale oppure per appartenenza attiva come coordinatore di reparto.
 const globalAccess=["admin","nurse_coordinator"].includes(profile?.role);
 const {data:memberships,error:membershipError}=await sb.rpc("get_my_units");
 const hasCoordinatorUnit=!membershipError&&(memberships||[]).some(m=>m.unit_role==="coordinator"&&m.status==="active");
 if(!globalAccess&&!hasCoordinatorUnit){
  document.querySelector("main")?.replaceChildren();
  document.body.innerHTML='<main style="max-width:620px;margin:12vh auto;padding:28px;font:16px/1.5 system-ui;color:#10284b"><h1>Accesso riservato</h1><p>L’Area coordinamento è disponibile solo agli amministratori e agli utenti che sono coordinatori attivi di almeno un reparto.</p><p><a href="dashboard.html">Torna alla dashboard</a></p></main>';
  return;
 }
 await loadUnits();render();
}
async function loadUnits(keepId){
 const {data,error}=await sb.rpc("get_my_units");
 if(error){note("Non riesco a caricare i reparti: "+error.message,"error");units=[];unit=null;return}
 units=(data||[]).filter(m=>m.unit_role==="coordinator"&&m.status==="active").map(m=>({id:m.unit_id,name:m.name,join_code:m.join_code}));
 const want=keepId||unit?.id;
 unit=units.find(u=>u.id===want)||units[0]||null;
 if(unit)await loadData();
}
async function rosterRpc(){
 const full=await sb.rpc("get_unit_roster_full",{p_unit:unit.id});
 if(!full.error)return full;
 return sb.rpc("get_unit_roster_with_phone",{p_unit:unit.id});
}
const need=c=>Number(unit?.cov?.[c])||0;
const needSum=()=>WORK.reduce((x,c)=>x+need(c),0);
function csvEsc(v){v=String(v??"");return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCsv(){
 const a=approved(),n=dim(),y=cursor.getFullYear(),m=cursor.getMonth();
 const head=["Persona","Ruolo"].concat(Array.from({length:n},(_,i)=>i+1+" "+WD[new Date(y,m,i+1).getDay()]),["Ore"]);
 const rows=a.map(p=>{let h=0;const cells=Array.from({length:n},(_,i)=>{const c=as[p.user_id+"|"+ymd(y,m,i+1)]?.code||"";h+=SHIFT_HOURS[c]||0;return c});return [p.display_name,roleLabel(p.staff_role)].concat(cells,[h])});
 const csv="\ufeff"+[head].concat(rows).map(r=>r.map(csvEsc).join(";")).join("\r\n");
 const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
 const el=document.createElement("a");el.href=url;el.download="turni-"+y+"-"+pad(m+1)+".csv";document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
const monthHoursDue=p=>p.weekly_hours?Math.round(Number(p.weekly_hours)*dim()/7*10)/10:null;
async function loadData(){
 const [from,to]=range(),prev=new Date(cursor.getFullYear(),cursor.getMonth(),-6);
 const [r,a,s,iv,sw,ex,lv,cv]=await Promise.all([
  rosterRpc(),
  sb.from("unit_availability").select("user_id,day,choice,review_status").eq("unit_id",unit.id).gte("day",from).lte("day",to),
  sb.from("unit_shifts").select("user_id,shift_date,code,published").eq("unit_id",unit.id).gte("shift_date",keyOf(prev)).lte("shift_date",to),
  sb.from("unit_invitations").select("id,staff_role,label,created_at,expires_at,accepted_at,revoked_at").eq("unit_id",unit.id).order("created_at",{ascending:false}).limit(30),
  sb.from("unit_shift_swap_requests").select("id,requester_id,target_id,requester_shift_date,target_shift_date,message,status,created_at").eq("unit_id",unit.id).order("created_at",{ascending:false}).limit(50),
  sb.rpc("get_unit_document_expiries",{p_unit:unit.id}),
  sb.from("unit_leave_requests").select("id,user_id,start_date,end_date,kind,note,status").eq("unit_id",unit.id).order("created_at",{ascending:false}).limit(60),
  sb.from("units").select("coverage").eq("id",unit.id).maybeSingle()
 ]);
 leaves=lv.error?[]:(lv.data||[]);
 unit.cov=(cv&&!cv.error&&cv.data&&cv.data.coverage)||{M:0,P:0,G:0,N:0};
 invites=iv.error?[]:(iv.data||[]);
 swapRequests=sw.error?[]:(sw.data||[]);
 expiryRows=ex.error?[]:(ex.data||[]);
 const errs=[r.error,a.error,s.error,iv.error,sw.error,ex.error].filter(Boolean).map(e=>e.message);
 if(errs.length)note("Errore di caricamento: "+errs.join(" · "),"error");
 roster=r.data||[];av={};as={};
 (a.data||[]).forEach(x=>{av[x.user_id+"|"+x.day]={user_id:x.user_id,day:x.day,choice:x.choice,confirmed:x.review_status==="confirmed"}});
 (s.data||[]).forEach(x=>{as[x.user_id+"|"+x.shift_date]={user_id:x.user_id,day:x.shift_date,code:x.code,published:x.published}});
 recalcPub();
}
function warnings(){
 const out={},y=cursor.getFullYear(),m=cursor.getMonth(),from=range()[0];
 const start=new Date(y,m,-6),end=new Date(y,m,dim());
 approved().forEach(p=>{
  let streak=0,prev=null;
  for(let t=new Date(start);t<=end;t.setDate(t.getDate()+1)){
   const k=keyOf(t),code=as[p.user_id+"|"+k]?.code,work=WORK.includes(code);
   streak=work?streak+1:0;
   if(work&&k>=from){
    const w=[],pr=av[p.user_id+"|"+k]?.choice;
    if(pr==="OFF")w.push("segnata come non disponibile");
    if(pr==="R")w.push("aveva chiesto riposo");
    if(prev==="N"&&code!=="N")w.push("turno dopo una notte senza riposo");
    if(streak>6)w.push("oltre 6 giorni di fila ("+streak+")");
    if(w.length)out[p.user_id+"|"+k]=w;
   }
   prev=code||null;
  }
 });
 return out;
}
function createCard(){
 return '<section class="panel"><h2>'+(units.length?"Crea un altro reparto":"Crea il tuo reparto")+'</h2><p class="muted">Potrai invitare infermieri e OSS con un link personale, oppure dare loro il codice del reparto.</p><form id="wardForm" class="row"><div class="field"><label for="wardName">Nome del reparto</label><input id="wardName" minlength="2" maxlength="80" required placeholder="Es. Medicina Generale"></div><button class="btn" type="submit">Crea reparto</button></form></section>';
}
function homeView(){
 const today=keyOf(new Date()),a=nurses(),np=pending().length,[from,to]=range();
 const inf=approved().filter(m=>m.staff_role!=="oss").length,oss=approved().length-inf;
 const toConfirm=a.filter(p=>Object.values(av).some(r=>r.user_id===p.user_id&&!r.confirmed)).length;
 const noAv=a.filter(p=>!Object.values(av).some(r=>r.user_id===p.user_id)).length;
 const w=Object.keys(warnings()).length;
 const monthShifts=Object.values(as).filter(x=>x.day>=from&&x.day<=to),pub=monthShifts.filter(x=>x.published).length;
 const gaps=[];for(let d=1;d<=dim();d++){const k=ymd(cursor.getFullYear(),cursor.getMonth(),d);if(k<today)continue;const cnt=c=>a.filter(p=>as[p.user_id+"|"+k]?.code===c).length;const tot=a.filter(p=>WORK.includes(as[p.user_id+"|"+k]?.code)).length;if(needSum()?WORK.some(c=>need(c)&&cnt(c)<need(c)):tot<2)gaps.push(d)}
 const sh=c=>approved().filter(p=>as[p.user_id+"|"+today]?.code===c).map(p=>safe(p.display_name)+(p.staff_role==="oss"?" <small class=\"muted\">OSS</small>":""));
 const row=(l,names)=>'<div class="item"><b>'+l+'</b><span>'+(names.length?names.join(", "):'<span class="muted">—</span>')+'</span></div>';
 const stat=(n,l,tabId,warn)=>'<button class="statcard'+(warn?" warn":"")+'" data-tab="'+tabId+'"><b>'+n+'</b><span>'+l+'</span></button>';
 return '<section class="statgrid">'+stat(np,"richieste di ingresso","req",np>0)+stat(toConfirm,"persone con disponibilità da confermare","avail",toConfirm>0)+stat(noAv,"senza disponibilità questo mese","avail",false)+stat(w,"avvisi nei turni","plan",w>0)+'</section>'

async function run(p,okText){
 const {error}=await p;
 if(error){note("Operazione non riuscita: "+error.message,"error");render();return false}
 if(okText)note(okText,"");
 await loadData();render();return true;
}
const review=(uid,action,okText)=>run(sb.rpc("review_unit_member",{p_unit:unit.id,p_user:uid,p_action:action}),okText);
function printPlan(){
 if(!unit||!approved().length){alert("Non ci sono turni da stampare.");return}
 const y=cursor.getFullYear(),m=cursor.getMonth(),n=dim(),a=approved();
 const title=cursor.toLocaleDateString("it-IT",{month:"long",year:"numeric"});
 const NAMES={M:"Mattina",P:"Pomeriggio",G:"Giornata",N:"Notte",R:"Riposo"};
 const days=Array.from({length:n},(_,i)=>{const wd=new Date(y,m,i+1).getDay();return {d:i+1,k:ymd(y,m,i+1),we:wd===0||wd===6,l:WD[wd].slice(0,1)==="G"||WD[wd].slice(0,1)==="M"?WD[wd].slice(0,2):WD[wd].slice(0,1)}});
 const head='<tr><th class="name">Persona</th>'+days.map(x=>'<th class="'+(x.we?"we":"")+'">'+x.d+'<br>'+WD[new Date(y,m,x.d).getDay()].slice(0,2)+'</th>').join("")+'<th class="tot">Ore</th></tr>';
 const rows=a.map(p=>{let h=0;const cells=days.map(x=>{const c=as[p.user_id+"|"+x.k]?.code;h+=SHIFT_HOURS[c]||0;return '<td class="'+(c?"c-"+c:x.we?"we":"")+'">'+(c||"")+'</td>'}).join("");
  return '<tr><td class="name">'+safe(p.display_name)+'<small>'+roleLabel(p.staff_role)+'</small></td>'+cells+'<td class="tot">'+Math.round(h*10)/10+'</td></tr>'}).join("");
 const foot=WORK.map(c=>'<tr class="foot"><td class="name">'+NAMES[c]+'</td>'+days.map(x=>{const cnt=a.filter(p=>as[p.user_id+"|"+x.k]?.code===c).length;return '<td class="'+(need(c)&&cnt<need(c)?"low":"")+'">'+(cnt||"–")+'</td>'}).join("")+'<td></td></tr>').join("");
 const rowH=a.length>22?"6.2mm":a.length>16?"7.2mm":a.length>10?"8.6mm":"10.5mm";
 const el=document.createElement("div");el.id="printSheet";el.style.setProperty("--psrow",rowH);
 el.innerHTML='<div class="ps-head"><h1>'+safe(unit.name)+'<small>Turni di '+safe(title)+'</small></h1><div class="ps-brand">NaNo<b>Shift</b></div></div>'
  +'<table class="ps-table"><thead>'+head+'</thead><tbody>'+rows+foot+'</tbody></table>'
  +'<div class="ps-legend">'+["M","P","G","N","R"].map(c=>'<span><i style="background:'+({M:"#c58a12",P:"#3478d4",G:"#13845b",N:"#7754c8",R:"#fff4bf;border:.3mm solid #0057b7"})[c]+'"></i><b>'+c+"</b> "+NAMES[c]+(SHIFT_HOURS[c]?" ("+SHIFT_HOURS[c]+" h)":"")+'</span>').join("")+'</div>'
  +'<div class="ps-foot"><span>Stampato il '+new Date().toLocaleDateString("it-IT")+'</span><span>'+(monthPub?"Calendario pubblicato":"Bozza non pubblicata")+'</span></div>';
 document.getElementById("printSheet")?.remove();
 document.body.appendChild(el);
 const done=()=>{el.remove();window.removeEventListener("afterprint",done)};
 window.addEventListener("afterprint",done);
 setTimeout(()=>window.print(),60);
}
function bind(){
 const wf=$("wardForm");if(wf)wf.onsubmit=async e=>{
  e.preventDefault();const {data,error}=await sb.rpc("create_unit",{p_name:$("wardName").value});
  if(error){note("Creazione non riuscita: "+error.message,"error");render();return}
  tab="req";await loadUnits(data);const u=units.find(x=>x.id===data);
  note(u?"Reparto creato. Dai il codice "+u.join_code+" ai tuoi infermieri.":"Reparto creato.","");render();
 };
 const ws=$("wardSel");if(ws)ws.onchange=async()=>{unit=units.find(u=>u.id===ws.value);note(null);await loadData();render()};
 const cc=$("copyCode");if(cc)cc.onclick=async()=>{try{await navigator.clipboard.writeText(unit.join_code);cc.textContent="Copiato ✓"}catch(_){cc.textContent=unit.join_code}};
 const inf=$("inviteForm");if(inf)inf.onsubmit=async e=>{
  e.preventDefault();
  const token=Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b=>b.toString(16).padStart(2,"0")).join("");
  const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(token));
  const hash=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
  const {error}=await sb.rpc("create_unit_invitation",{p_unit:unit.id,p_token_hash:hash,p_staff_role:$("invRole").value,p_label:$("invLabel").value});
  if(error){note("Invito non creato: "+error.message,"error");render();return}
  const link=location.origin+location.pathname.replace(/[^/]*$/,"")+"accesso.html?unit_invite="+encodeURIComponent(token);
  let copied=true;try{await navigator.clipboard.writeText(link)}catch(_){copied=false}
  await loadData();
  note(copied?"Link creato e copiato. Invialo alla persona: vale 14 giorni.":"Link creato (copialo e invialo): "+link,"");render();
 };
 document.querySelectorAll("[data-revoke]").forEach(b=>b.onclick=()=>{if(confirm("Revocare questo invito? Il link smetterà di funzionare."))run(sb.rpc("revoke_unit_invitation",{p_id:b.dataset.revoke}),"Invito revocato.")});
 document.querySelectorAll("[data-role-of]").forEach(s=>s.onchange=()=>review(s.dataset.roleOf,"role_"+s.value,"Ruolo aggiornato."));
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;note(null);render()});
 document.querySelectorAll("[data-month]").forEach(b=>b.onclick=async()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+Number(b.dataset.month),1);note(null);await loadData();render()});
 document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>review(b.dataset.approve,"approve","Richiesta approvata."));
 document.querySelectorAll("[data-reject]").forEach(b=>b.onclick=()=>review(b.dataset.reject,"reject","Richiesta rifiutata."));
 document.querySelectorAll("[data-promote]").forEach(b=>b.onclick=()=>{if(confirm("Rendere questa persona coordinatore del reparto? Potrà gestire personale e turni."))review(b.dataset.promote,"promote","Ora è coordinatore del reparto.")});
 document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{if(confirm("Rimuovere questa persona dal reparto? I suoi turni e le sue disponibilità in questo reparto verranno eliminati."))review(b.dataset.remove,"remove","Persona rimossa dal reparto.")});
 document.querySelectorAll("[data-swap-review]").forEach(b=>b.onclick=async()=>{
  const approve=b.dataset.swapReview==="approve";
  if(!confirm(approve?"Approvare lo scambio e aggiornare i turni pubblicati?":"Rifiutare lo scambio? I turni resteranno invariati."))return;
  const {error}=await sb.rpc("review_unit_shift_swap",{p_request:b.dataset.swapId,p_approve:approve});
  if(error)note("Cambio turno non gestito: "+error.message,"error");
  else note(approve?"Cambio turno approvato e calendario aggiornato.":"Richiesta di cambio turno rifiutata.","");
  await loadData();render();
 });
 document.querySelectorAll("[data-confirm]").forEach(b=>b.onclick=()=>{const [from,to]=range();run(sb.rpc("review_unit_availability",{p_unit:unit.id,p_user:b.dataset.confirm,p_from:from,p_to:to,p_status:b.dataset.set}),b.dataset.set==="confirmed"?"Disponibilità confermate.":"Disponibilità riaperte.")});
 const ca=$("confirmAll");if(ca)ca.onclick=async()=>{
  const [from,to]=range(),ids=nurses().filter(p=>Object.values(av).some(r=>r.user_id===p.user_id&&!r.confirmed)).map(p=>p.user_id);
  const res=await Promise.all(ids.map(id=>sb.rpc("review_unit_availability",{p_unit:unit.id,p_user:id,p_from:from,p_to:to,p_status:"confirmed"})));
  const bad=res.find(r=>r.error);
  if(bad){note("Operazione non riuscita: "+bad.error.message,"error");await loadData();render();return}
  note("Tutte le disponibilità del mese sono confermate.","");await loadData();render();
 };
 const qa=$("quickAssign");if(qa)qa.onsubmit=async e=>{
  e.preventDefault();const uid=$("qaPerson").value,from=$("qaFrom").value,to=$("qaTo").value,code=$("qaCode").value,days=$("qaDays").value;
  if(!uid||!from||!to||from>to){note("Controlla persona e intervallo di date.","error");render();return}
  const rows=[];for(let t=new Date(from+"T12:00:00");keyOf(t)<=to;t.setDate(t.getDate()+1)){
   const wd=t.getDay();if(days==="weekdays"&&(wd===0||wd===6))continue;
   rows.push({unit_id:unit.id,user_id:uid,shift_date:keyOf(t),code,published:false,updated_at:new Date().toISOString()});
  }
  if(!rows.length){note("Nessuna data selezionata nell’intervallo.","error");render();return}
  if(!confirm("Assegnare "+code+" a "+(roster.find(p=>p.user_id===uid)?.display_name||"questa persona")+" per "+rows.length+" giorni? I turni esistenti in queste date saranno sostituiti."))return;
  const {error}=await sb.from("unit_shifts").upsert(rows,{onConflict:"unit_id,user_id,shift_date"});
  if(error){note("Assegnazione rapida non riuscita: "+error.message,"error");render();return}
  note("Assegnati "+rows.length+" turni. Pubblica il calendario quando hai finito.","");await loadData();render();
 };
 document.querySelectorAll("[data-cell]").forEach(b=>b.onclick=()=>openCell(b.dataset.cell,b.dataset.day));
 const gp=$("generatePlan");if(gp)gp.onclick=generatePlan;
 const ex=$("exportCsv");if(ex)ex.onclick=exportCsv;
 const cvf=$("coverageForm");if(cvf)cvf.onsubmit=async e=>{e.preventDefault();const o={};WORK.forEach(c=>o[c]=Number($("cv"+c).value)||0);
  const {error}=await sb.rpc("set_unit_coverage",{p_unit:unit.id,p_coverage:o});
  if(error){note("Fabbisogno non salvato: "+error.message+" (applica l'ultima migrazione del database)","error");render();return}
  note("Fabbisogno salvato.","");await loadData();render()};
 document.querySelectorAll("[data-hours-of]").forEach(i=>i.onchange=async()=>{const v=i.value===""?null:Number(i.value);
  const {error}=await sb.rpc("set_member_hours",{p_unit:unit.id,p_user:i.dataset.hoursOf,p_hours:v});
  if(error){note("Ore non salvate: "+error.message,"error");render();return}
  note("Ore settimanali aggiornate.","");await loadData();render()});
 document.querySelectorAll("[data-leave]").forEach(b=>b.onclick=async()=>{const ok=b.dataset.leave==="approve";
  const {error}=await sb.rpc("review_unit_leave",{p_request:b.dataset.id,p_approve:ok});
  if(error)note("Richiesta non gestita: "+error.message,"error");else note(ok?"Richiesta approvata: giorni segnati non disponibili.":"Richiesta rifiutata.","");
  await loadData();render()});
 const pp=$("printPlan");if(pp)pp.onclick=printPlan;
 const tp=$("togglePub");if(tp)tp.onclick=()=>{
  const [from,to]=range(),next=!monthPub;
  if(next&&!confirm("Pubblicare i turni del mese? Gli infermieri potranno vederli."))return;
  run(sb.rpc("publish_unit_shifts",{p_unit:unit.id,p_from:from,p_to:to,p_published:next}),next?"Turni pubblicati. Il personale riceve un avviso.":"Pubblicazione ritirata.").then(ok=>{if(ok&&next)sb.rpc("notify_unit_published",{p_unit:unit.id,p_from:from,p_to:to})});
 };
}
async function generatePlan(){
 const [from,to]=range(),staff=approved(),days=dim(),year=cursor.getFullYear(),month=cursor.getMonth();
 if(!staff.length){note("Prima approva almeno un infermiere del reparto.","warn");render();return}
 const monthAvailability=Object.values(av).filter(r=>r.day>=from&&r.day<=to);
 const unreviewed=staff.filter(p=>monthAvailability.some(r=>r.user_id===p.user_id&&!r.confirmed));
 if(unreviewed.length){note("Ci sono disponibilità non approvate. Confermale prima di generare i turni.","warn");render();return}
 const missing=staff.filter(p=>!monthAvailability.some(r=>r.user_id===p.user_id&&r.confirmed));
 if(missing.length&&!confirm("Non risultano disponibilità per: "+missing.map(p=>p.display_name).join(", ")+". Per queste persone non sarà possibile generare turni. Vuoi continuare?"))return;
 const existing=Object.values(as).filter(x=>x.day>=from&&x.day<=to);
 if(monthPub&&!confirm("Il calendario risulta pubblicato. Rigenerando i turni dovrai ricontrollare e ripubblicare la nuova bozza. Continuare?"))return;
 if(!confirm("Generare la bozza usando TUTTE le disponibilità confermate? Le preferenze M/P/G/N saranno assegnate esattamente come indicate, 'L' sarà trasformato in un turno da distribuire, 'Ri' in riposo e '✕' resterà senza turno. Non verranno applicati limiti settimanali né esclusi sabati o domeniche. Gli eventuali problemi saranno segnalati con avvisi, senza eliminare le disponibilità. I turni già presenti nel mese verranno sostituiti."))return;
 if(existing.some(x=>x.published)){
  const {error}=await sb.rpc("publish_unit_shifts",{p_unit:unit.id,p_from:from,p_to:to,p_published:false});
  if(error){note("Non riesco a ritirare la pubblicazione prima di rigenerare: "+error.message,"error");render();return}
 }
 const planned=[],typeCounts={};
 for(const p of staff)typeCounts[p.user_id]={M:0,P:0,G:0,N:0};
 for(let d=1;d<=days;d++){
  const day=ymd(year,month,d);
  const available=staff.map(p=>({p,r:av[p.user_id+"|"+day]})).filter(x=>x.r&&x.r.confirmed);
  const open=available.filter(x=>x.r.choice==="ANY");
  const dayTypes={M:0,P:0,G:0,N:0};
  // Honor every explicit preference, including weekends and consecutive shifts.
  for(const {p,r} of available){
   if(r.choice==="OFF")continue;
   if(r.choice==="R"){
    planned.push({unit_id:unit.id,user_id:p.user_id,shift_date:day,code:"R",published:false,updated_at:new Date().toISOString()});
    continue;
   }
   if(["M","P","G","N"].includes(r.choice)){
    planned.push({unit_id:unit.id,user_id:p.user_id,shift_date:day,code:r.choice,published:false,updated_at:new Date().toISOString()});
    typeCounts[p.user_id][r.choice]++;dayTypes[r.choice]++;
   }
  }
  // "L / libero" means available for any shift: distribute these without excluding dates or imposing caps.
  open.sort((a,b)=>
   (Object.values(typeCounts[a.p.user_id]).reduce((x,y)=>x+y,0)-Object.values(typeCounts[b.p.user_id]).reduce((x,y)=>x+y,0))||
   a.p.display_name.localeCompare(b.p.display_name,"it")
  );
  for(const {p} of open){
   const code=["M","P","G","N"].sort((a,b)=>dayTypes[a]-dayTypes[b]||typeCounts[p.user_id][a]-typeCounts[p.user_id][b])[0];
   planned.push({unit_id:unit.id,user_id:p.user_id,shift_date:day,code,published:false,updated_at:new Date().toISOString()});
   typeCounts[p.user_id][code]++;dayTypes[code]++;
  }
 }
 const {error:delError}=await sb.from("unit_shifts").delete().eq("unit_id",unit.id).gte("shift_date",from).lte("shift_date",to);
 if(delError){note("Non riesco a sostituire la bozza esistente: "+delError.message,"error");await loadData();render();return}
 if(planned.length){
  const {error:insertError}=await sb.from("unit_shifts").insert(planned);
  if(insertError){note("Bozza non salvata: "+insertError.message,"error");await loadData();render();return}
 }
 note("Bozza generata: "+planned.length+" righe da disponibilità confermate. Sono state mantenute tutte le preferenze; controlla gli avvisi e poi modifica o pubblica il calendario.","");
 await loadData();render();
}
function openCell(uid,day){
 const p=roster.find(x=>x.user_id===uid),cur=as[uid+"|"+day]?.code||"",r=av[uid+"|"+day],d=new Date(day+"T12:00:00");
 const dlg=$("cellDlg");
 dlg.innerHTML='<h2 style="margin:0">'+safe(p.display_name)+'</h2><div class="muted">'+d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})+'</div><p>'+(r?"Disponibilità: <b>"+PREF_TXT[r.choice]+"</b>"+(r.confirmed?" (confermata)":" (non ancora confermata)"):"Nessuna disponibilità indicata.")+'</p><div class="opts">'+[["","Nessuno"],["M","M Mattina"],["P","P Pomeriggio"],["G","G Giornata"],["N","N Notte"],["R","R Riposo"]].map(([c,l])=>'<button type="button" data-code="'+c+'" class="'+(cur===c?"on":"")+'">'+l+"</button>").join("")+'</div><button class="btn secondary" type="button" id="cellClose">Chiudi</button>';
 dlg.querySelectorAll("[data-code]").forEach(b=>b.onclick=async()=>{dlg.close();await setCell(uid,day,b.dataset.code)});
 $("cellClose").onclick=()=>dlg.close();
 dlg.showModal();
}
async function setCell(uid,day,code){
 const existing=as[uid+"|"+day];let res;
 const where=q=>q.eq("unit_id",unit.id).eq("user_id",uid).eq("shift_date",day);
 if(!code){if(!existing)return;res=await where(sb.from("unit_shifts").delete())}
 else if(existing){if(existing.code===code)return;res=await where(sb.from("unit_shifts").update({code,updated_at:new Date().toISOString()}))}
 else res=await sb.from("unit_shifts").insert({unit_id:unit.id,user_id:uid,shift_date:day,code,published:monthPub});
 if(res.error){note("Salvataggio non riuscito: "+res.error.message,"error");render();return}
 note(null);
 const k=uid+"|"+day;
 if(!code)delete as[k];else as[k]={user_id:uid,day,code,published:existing?existing.published:monthPub};
 recalcPub();render();
}
init();
</script>
