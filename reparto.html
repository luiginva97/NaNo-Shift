<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fc">
<title>NaNo Shift · Reparto</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<style>
:root{--navy:#10284b;--blue:#2463eb;--pale:#edf3ff;--bg:#f5f7fc;--line:#dfe6f1;--muted:#68778f;--red:#b42318;--green:#13845b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px max(16px,calc((100% - 1000px)/2));background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;color:#0057B7}.brand img{width:30px;height:30px}.brand span{color:#b88700}
.links{display:flex;gap:8px;flex-wrap:wrap}.links a{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--navy);text-decoration:none;font-weight:650;font-size:14px}
.wrap{max-width:1000px;margin:auto;padding:18px 14px 60px}
h1{margin:0 0 4px;font-size:clamp(22px,4vw,29px);letter-spacing:-.4px}h2{margin:0 0 8px;font-size:18px}
.muted{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 4px 18px #18345b08}
.btn{border:0;border-radius:11px;background:var(--blue);color:#fff;padding:10px 15px;font-weight:700}.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn:disabled{opacity:.5;cursor:default}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input,.field select,select.inline{width:100%;padding:11px;border:1px solid #ccd6e4;border-radius:10px;background:#fff;color:var(--navy)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.row .field{flex:1;min-width:180px}
.notice{padding:11px 13px;border-radius:10px;background:#eaf7f0;color:#146543;margin:12px 0}.notice.error{background:#fff0ef;color:var(--red)}.notice.warn{background:#fff8e6;color:#7a5200}
.tabs{display:flex;gap:7px;margin:14px 0 0;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:650}.tabs button.active{background:var(--pale);border-color:#b9cdfb;color:var(--blue)}
.monthnav{display:flex;align-items:center;gap:8px;margin:14px 0 6px}.monthnav strong{min-width:150px;text-align:center;text-transform:capitalize}.monthnav button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px}
.day{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.day:last-child{border-bottom:0}
.day .d{width:62px;font-weight:700;font-size:14px}.day.we .d{color:var(--red)}.day.dirty{background:#f8faff}
.chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:650;color:var(--navy)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}.chip.on.rest{background:#7754c8;border-color:#7754c8}.chip.on.unavailable{background:var(--red);border-color:var(--red)}.chip.on.free{background:var(--green);border-color:var(--green)}
.chip:disabled{opacity:.55;cursor:default}.lock{font-size:12px;color:var(--green);font-weight:700}
.savebar{position:sticky;bottom:0;background:#fffffff0;border-top:1px solid var(--line);padding:10px 0;margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;min-width:26px;text-align:center;padding:3px 7px;border-radius:7px;color:#fff;font-weight:800;font-size:12px}.M{background:#c58a12}.P{background:#3478d4}.G{background:#13845b}.N{background:#7754c8}.R{background:#fff4bf;color:#0755b7;border:1px solid #0057b7}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.scroll{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;font-size:12px;min-width:100%}th,td{border:1px solid var(--line);padding:4px 3px;text-align:center;min-width:28px}th:first-child,td:first-child{position:sticky;left:0;background:#fff;text-align:left;min-width:110px;padding-left:8px;font-weight:700;z-index:1}tr.me td:first-child{color:var(--blue)}th.we{color:var(--red)}
.list{margin:0;padding:0;list-style:none}
@media(max-width:560px){.day .d{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="brand"><img src="favicon.svg" alt=""> NaNo<span>Shift</span> · Reparto</div><div class="links"><a href="dashboard.html">← Dashboard</a><a href="coordinatrice.html">Area coordinatrice</a></div></header>
<main class="wrap" id="app"><div class="panel">Caricamento…</div></main>
<script>
const SUPABASE_URL="https://mmkdibdomjaxwqfryqcw.supabase.co";
const SUPABASE_KEY="sb_publishable_QPArC4ARilfFLqxnNsV72A_UBzZN-5g";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PREFS=[["free","Libero"],["M","Prefer. M"],["P","Prefer. P"],["G","Prefer. G"],["N","Prefer. N"],["rest","Vorrei riposo"],["unavailable","Non disponibile"]];
const SHIFT={M:["07:00","14:00"],P:["14:00","19:00"],G:["07:00","19:00"],N:["19:00","07:00"],R:["00:00","00:00"]};
const WD=["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
let user=null,memberships=[],ward=null,cursor=new Date(),tab="avail",avail={},orig={},locked=new Set(),schedule=[],msg=null,busy=false;
cursor.setDate(1);
const ymd=(y,m,d)=>y+"-"+pad(m+1)+"-"+pad(d);
const dim=()=>new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate();
const range=()=>[ymd(cursor.getFullYear(),cursor.getMonth(),1),ymd(cursor.getFullYear(),cursor.getMonth(),dim())];
const dirty=()=>Object.keys(avail).some(d=>avail[d]!==orig[d]);
const note=(t,type="")=>{msg=t?{t,type}:null};
async function init(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){location.href="accesso.html";return}
 user=session.user;
 await loadMemberships();render();
}
async function loadMemberships(){
 const {data,error}=await sb.rpc("coord_my_memberships");
 if(error){note("Non riesco a caricare i reparti: "+error.message+" (la migrazione coordinatrice è stata applicata al database?)","error");memberships=[];ward=null;return}
 memberships=data||[];
 const ok=memberships.filter(m=>m.status==="approved");
 if(!ward||!ok.some(m=>m.ward_id===ward.id))ward=ok[0]?{id:ok[0].ward_id,name:ok[0].ward_name}:null;
 if(ward)await loadMonth();
}
async function loadMonth(){
 const [from,to]=range();
 const [a,s]=await Promise.all([
  sb.from("coord_availability").select("day,preference,confirmed").eq("ward_id",ward.id).eq("user_id",user.id).gte("day",from).lte("day",to),
  sb.rpc("coord_get_schedule",{p_ward:ward.id,p_from:from,p_to:to})
 ]);
 const errs=[a.error,s.error].filter(Boolean).map(e=>e.message);
 if(errs.length)note("Errore di caricamento: "+errs.join(" · "),"error");
 avail={};orig={};locked=new Set();
 (a.data||[]).forEach(r=>{avail[r.day]=r.preference;orig[r.day]=r.preference;if(r.confirmed)locked.add(r.day)});
 schedule=s.data||[];
}
function joinCard(){
 const pending=memberships.filter(m=>m.status!=="approved").map(m=>'<div class="item"><span><b>'+safe(m.ward_name)+'</b></span><span class="muted">'+(m.status==="pending"?"In attesa di approvazione":"Richiesta rifiutata")+'</span></div>').join("");
 return '<section class="panel"><h2>Entra in un reparto</h2><p class="muted">Chiedi il codice di 6 caratteri alla tua coordinatrice. Potrai indicare le disponibilità dopo la sua approvazione.</p><form id="joinForm" class="row"><div class="field"><label for="code">Codice reparto</label><input id="code" maxlength="6" autocapitalize="characters" autocomplete="off" required placeholder="Es. K7M2QX"></div><button class="btn" type="submit">Invia richiesta</button></form>'+(pending?'<div style="margin-top:12px">'+pending+'</div>':"")+'</section>';
}
function availView(){
 const y=cursor.getFullYear(),m=cursor.getMonth();let h="";
 for(let d=1;d<=dim();d++){
  const key=ymd(y,m,d),wd=new Date(y,m,d).getDay(),cur=avail[key]||"free",lock=locked.has(key);
  h+='<div class="day'+(wd===0||wd===6?" we":"")+(avail[key]!==orig[key]?" dirty":"")+'"><div class="d">'+WD[wd]+" "+d+'</div><div class="chips">'+PREFS.map(([v,l])=>'<button type="button" class="chip '+v+(cur===v?" on":"")+'" data-day="'+key+'" data-pref="'+v+'"'+(lock?" disabled":"")+'>'+l+'</button>').join("")+'</div>'+(lock?'<span class="lock">✓ confermata</span>':"")+'</div>';
 }
 return '<section class="panel"><h2>Le tue disponibilità</h2><p class="muted">Per ogni giorno scegli: libero, preferenza per un turno, vorrei riposo oppure non disponibile. Dopo la conferma della coordinatrice un giorno non è più modificabile.</p>'+h+'<div class="savebar"><button class="btn" id="saveAvail"'+(dirty()&&!busy?"":" disabled")+'>'+(busy?"Salvataggio…":"Salva disponibilità")+'</button><select id="fillPref" class="inline" style="width:auto"><option value="">Imposta i giorni non confermati…</option>'+PREFS.map(([v,l])=>'<option value="'+v+'">'+l+'</option>').join("")+'</select>'+(dirty()?'<span class="muted">Modifiche non salvate</span>':"")+'</div></section>';
}
function scheduleView(){
 const y=cursor.getFullYear(),m=cursor.getMonth(),n=dim();
 if(!schedule.length)return '<section class="panel"><h2>Turni del reparto</h2><p class="muted">La coordinatrice non ha ancora pubblicato i turni di questo mese.</p></section>';
 const mine=schedule.filter(r=>r.user_id===user.id);
 const people=[...new Map(schedule.map(r=>[r.user_id,r.display_name])).entries()].sort((a,b)=>(a[0]===user.id?-1:b[0]===user.id?1:String(a[1]).localeCompare(String(b[1]),"it")));
 const by={};schedule.forEach(r=>{by[r.user_id+"|"+r.day]=r.code});
 let head="<tr><th>Persona</th>";for(let d=1;d<=n;d++){const wd=new Date(y,m,d).getDay();head+='<th class="'+(wd===0||wd===6?"we":"")+'">'+d+"</th>"}head+="</tr>";
 const body=people.map(([id,name])=>'<tr class="'+(id===user.id?"me":"")+'"><td>'+safe(name)+(id===user.id?" (tu)":"")+"</td>"+Array.from({length:n},(_,i)=>{const c=by[id+"|"+ymd(y,m,i+1)];return "<td>"+(c?'<span class="pill '+c+'">'+c+"</span>":"")+"</td>"}).join("")+"</tr>").join("");
 const list=mine.map(r=>'<div class="item"><span><b>'+new Date(r.day+"T12:00:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})+'</b></span><span class="pill '+r.code+'">'+r.code+'</span></div>').join("")||'<p class="muted">Nessun turno assegnato a te questo mese.</p>';
 return '<section class="panel"><h2>I tuoi turni</h2>'+list+(mine.length?'<div class="savebar"><button class="btn" id="importShifts">Importa nel mio calendario</button></div>':"")+'</section><section class="panel"><h2>Turni del reparto</h2><div class="scroll"><table>'+head+body+'</table></div></section>';
}
function render(){
 const app=$("app");
 let h='<h1>'+(ward?safe(ward.name):"Reparto")+'</h1><div class="muted">Disponibilità e turni pubblicati dalla coordinatrice.</div>';
 if(msg)h+='<div class="notice '+msg.type+'" role="status">'+safe(msg.t)+'</div>';
 const approved=memberships.filter(m=>m.status==="approved");
 if(approved.length>1)h+='<div class="field" style="margin-top:10px"><label for="wardSel">Reparto</label><select id="wardSel">'+approved.map(m=>'<option value="'+m.ward_id+'"'+(ward&&m.ward_id===ward.id?" selected":"")+'>'+safe(m.ward_name)+'</option>').join("")+'</select></div>';
 if(!ward){h+=joinCard();app.innerHTML=h;bind();return}
 h+='<div class="tabs"><button data-tab="avail" class="'+(tab==="avail"?"active":"")+'">Disponibilità</button><button data-tab="sched" class="'+(tab==="sched"?"active":"")+'">Turni pubblicati</button></div>';
 h+='<div class="monthnav"><button data-month="-1" aria-label="Mese precedente">‹</button><strong>'+cursor.toLocaleDateString("it-IT",{month:"long",year:"numeric"})+'</strong><button data-month="1" aria-label="Mese successivo">›</button></div>';
 h+=tab==="avail"?availView():scheduleView();
 h+=joinCard().replace('<section class="panel"><h2>Entra in un reparto</h2>','<section class="panel"><h2>Entra in un altro reparto</h2>');
 app.innerHTML=h;bind();
}
function bind(){
 const jf=$("joinForm");if(jf)jf.onsubmit=async e=>{
  e.preventDefault();const {data,error}=await sb.rpc("coord_request_join",{p_code:$("code").value});
  if(error){note(error.message,"error")}else{note(data.status==="approved"?"Sei già nel reparto "+data.ward_name+".":data.status==="rejected"?"La coordinatrice di "+data.ward_name+" ha rifiutato la tua richiesta: contattala per riaprirla.":"Richiesta inviata a "+data.ward_name+": attendi l'approvazione della coordinatrice.",data.status==="rejected"?"error":"")}
  await loadMemberships();render();
 };
 const ws=$("wardSel");if(ws)ws.onchange=async()=>{const m=memberships.find(x=>x.ward_id===ws.value);ward={id:m.ward_id,name:m.ward_name};note(null);await loadMonth();render()};
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 document.querySelectorAll("[data-month]").forEach(b=>b.onclick=async()=>{
  if(dirty()&&!confirm("Hai modifiche non salvate. Vuoi cambiare mese e perderle?"))return;
  cursor=new Date(cursor.getFullYear(),cursor.getMonth()+Number(b.dataset.month),1);note(null);await loadMonth();render();
 });
 document.querySelectorAll(".chip[data-day]").forEach(b=>b.onclick=()=>{avail[b.dataset.day]=b.dataset.pref;const y=window.scrollY;render();window.scrollTo(0,y)});
 const fill=$("fillPref");if(fill)fill.onchange=()=>{if(!fill.value)return;for(let d=1;d<=dim();d++){const k=ymd(cursor.getFullYear(),cursor.getMonth(),d);if(!locked.has(k))avail[k]=fill.value}render()};
 const sv=$("saveAvail");if(sv)sv.onclick=saveAvail;
 const im=$("importShifts");if(im)im.onclick=importShifts;
}
async function saveAvail(){
 const rows=Object.keys(avail).filter(d=>avail[d]!==orig[d]&&!locked.has(d)).map(d=>({day:d,preference:avail[d]}));
 if(!rows.length)return;
 busy=true;render();
 const {error}=await sb.rpc("coord_save_availability",{p_ward:ward.id,p_rows:rows});
 busy=false;
 if(error)note("Salvataggio non riuscito: "+error.message,"error");else note("Disponibilità salvate.","");
 await loadMonth();render();
}
async function importShifts(){
 const [from,to]=range(),mine=schedule.filter(r=>r.user_id===user.id);
 const {data:existing,error:e1}=await sb.from("shifts").select("shift_date").eq("user_id",user.id).gte("shift_date",from).lte("shift_date",to);
 if(e1){note("Importazione non riuscita: "+e1.message,"error");render();return}
 const taken=new Set((existing||[]).map(r=>r.shift_date));
 const rows=mine.filter(r=>!taken.has(r.day)).map(r=>({user_id:user.id,shift_date:r.day,code:r.code,start_time:SHIFT[r.code][0],end_time:SHIFT[r.code][1],actual_hours:r.code==="R"?0:null,availability_hours:0,notes:"Reparto: "+ward.name,updated_at:new Date().toISOString()}));
 if(!rows.length){note("Tutti i turni sono già nel tuo calendario.","warn");render();return}
 const {error}=await sb.from("shifts").insert(rows);
 if(error)note("Importazione non riuscita: "+error.message,"error");
 else note("Importati "+rows.length+" turni nel tuo calendario"+(mine.length>rows.length?" ("+(mine.length-rows.length)+" già presenti, saltati).":"."),"");
 render();
}
window.addEventListener("beforeunload",e=>{if(dirty()){e.preventDefault();e.returnValue=""}});
init();
</script>
</body>
</html>
