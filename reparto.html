<style>
:root{--navy:#10284b;--blue:#2463eb;--pale:#edf3ff;--bg:#f5f7fc;--line:#dfe6f1;--muted:#68778f;--red:#b42318;--green:#13845b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px max(18px,calc((100% - 1180px)/2));background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;color:#0057B7}.brand img{width:190px;height:auto;max-height:62px;object-fit:contain}
.links{display:flex;gap:8px;flex-wrap:wrap}.links a{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--navy);text-decoration:none;font-weight:650;font-size:14px}
.wrap{max-width:1180px;margin:auto;padding:24px 18px 48px}
h1{margin:0 0 4px;font-size:clamp(22px,4vw,29px);letter-spacing:-.4px}h2{margin:0 0 8px;font-size:18px}
.muted{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 4px 18px #18345b08}
.btn{border:0;border-radius:11px;background:var(--blue);color:#fff;padding:10px 15px;font-weight:700}.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn:disabled{opacity:.5;cursor:default}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input,.field select,select.inline{width:100%;padding:11px;border:1px solid #ccd6e4;border-radius:10px;background:#fff;color:var(--navy)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.row .field{flex:1;min-width:180px}
.notice{padding:11px 13px;border-radius:10px;background:#eaf7f0;color:#146543;margin:12px 0}.notice.error{background:#fff0ef;color:var(--red)}.notice.warn{background:#fff8e6;color:#7a5200}
.tabs{display:flex;gap:7px;margin:14px 0 0;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:650}.tabs button.active{background:var(--pale);border-color:#b9cdfb;color:var(--blue)}
.monthnav{display:flex;align-items:center;gap:8px;margin:14px 0 6px}.monthnav strong{min-width:150px;text-align:center;text-transform:capitalize}.monthnav button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px}
/* Disponibilità in schede mensili */
.day{display:flex;flex-direction:column;align-items:stretch;gap:9px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:13px;min-width:0;box-shadow:0 2px 8px #18345b08}
.day .d{width:auto;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.day.we .d{color:var(--red)}.day.dirty{background:#f2f7ff;border-color:#9bb8f4;box-shadow:0 0 0 1px #9bb8f455}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;flex:1}
.chip{min-width:0;border:1px solid var(--line);background:#f8faff;border-radius:9px;padding:8px 5px;font-size:12px;line-height:1.2;font-weight:700;color:var(--navy);white-space:normal}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 5px #2463eb30}.chip.on.rest{background:#7754c8;border-color:#7754c8}.chip.on.unavailable{background:var(--red);border-color:var(--red)}.chip.on.free{background:var(--green);border-color:var(--green)}
.chip:disabled{opacity:.62;cursor:default}.lock{display:block;font-size:11px;color:var(--green);font-weight:750;margin-top:auto}
#availabilityGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}
@media(max-width:900px){#availabilityGrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:620px){#availabilityGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.day{padding:10px}.chip{padding:9px 4px;font-size:12px}}
.pill{display:inline-block;min-width:26px;text-align:center;padding:3px 7px;border-radius:7px;color:#fff;font-weight:800;font-size:12px}.M{background:#c58a12}.P{background:#3478d4}.G{background:#13845b}.N{background:#7754c8}.R{background:#fff4bf;color:#0755b7;border:1px solid #0057b7}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.scroll{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;font-size:12px;min-width:100%}th,td{border:1px solid var(--line);padding:4px 3px;text-align:center;min-width:28px}th:first-child,td:first-child{position:sticky;left:0;background:#fff;text-align:left;min-width:110px;padding-left:8px;font-weight:700;z-index:1}tr.me td:first-child{color:var(--blue)}th.we{color:var(--red)}
.list{margin:0;padding:0;list-style:none}
@media(max-width:560px){.day .d{width:100%}}

/* Responsive polish: area reparto */
html{overflow-x:hidden}body{min-width:0;overflow-x:hidden}.top{width:100%;padding:12px max(12px,calc((100% - 1000px)/2))}.brand{min-width:0;flex-wrap:wrap;font-size:15px}.brand img{width:120px;max-height:36px}.links{min-width:0;display:flex;gap:6px;flex-wrap:wrap}.links a{white-space:normal;text-align:center;padding:8px 9px;font-size:13px}.wrap{width:100%;min-width:0;padding:14px 12px 36px}.panel{min-width:0;padding:13px;border-radius:13px}.monthnav{flex-wrap:wrap}.monthnav strong{min-width:0;flex:1;text-align:center}.scroll{max-width:100%;overscroll-behavior-x:contain}.savebar{position:sticky;bottom:0;padding:10px;background:#fffffff2;z-index:4}.row .field{min-width:min(180px,100%)}
@media(max-width:620px){.top{align-items:stretch;flex-direction:column;gap:10px}.links{display:grid;grid-template-columns:1fr 1fr}.links a{font-size:12px;padding:8px 5px}.wrap{padding:10px 8px 28px}.day{gap:6px;padding:10px 0}.day .d{width:100%;font-size:13px}.chips{width:100%;flex-basis:100%}.chip{padding:6px 9px;font-size:12px}.scroll table{min-width:680px}h1{font-size:24px}.panel h2{font-size:17px}}
</style>

<body>
<nav class="side-nav" id="sideNav" aria-label="Navigazione"></nav>
<header class="top"><div class="brand"><img class="logo-mark" src="favicon-192.png" alt=""><span class="brand-text"><span class="brand-name">NaNo<span class="brand-shift">Shift</span></span><small>Area reparto</small></span></div><div id="headerAccount"></div></header>
<main class="wrap" id="app"><div class="panel">Caricamento…</div></main>
<script>
const SUPABASE_URL="https://mmkdibdomjaxwqfryqcw.supabase.co";
const SUPABASE_KEY="sb_publishable_QPArC4ARilfFLqxnNsV72A_UBzZN-5g";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PREFS=[["ANY","Libero","free"],["M","Prefer. M","sp"],["P","Prefer. P","sp"],["G","Prefer. G","sp"],["N","Prefer. N","sp"],["R","Vorrei riposo","rest"],["OFF","Non disponibile","unavailable"]];
const SHIFT={M:["07:00","14:00"],P:["14:00","19:00"],G:["07:00","19:00"],N:["19:00","07:00"],R:["00:00","00:00"]};
const WD=["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
let user=null,units=[],unit=null,cursor=new Date(),tab="avail",avail={},orig={},review={},schedule=[],rosterContacts=[],swapRequests=[],msg=null,busy=false;
cursor.setDate(1);
const ymd=(y,m,d)=>y+"-"+pad(m+1)+"-"+pad(d);
const dim=()=>new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate();
const range=()=>[ymd(cursor.getFullYear(),cursor.getMonth(),1),ymd(cursor.getFullYear(),cursor.getMonth(),dim())];
const locked=d=>review[d]==="confirmed";
const dirty=()=>Object.keys(avail).some(d=>avail[d]!==orig[d]);
const note=(t,type="")=>{msg=t?{t,type}:null};
const myUnits=()=>units.filter(m=>m.status==="active"&&(m.unit_role==="nurse"||m.unit_role==="coordinator"));
async function handleUnitInvite(){
 const token=new URLSearchParams(location.search).get("unit_invite");
 if(!token)return;
 history.replaceState({},document.title,location.pathname);
 try{
  const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(token));
  const hash=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
  const {data:pv}=await sb.rpc("preview_unit_invitation",{p_token_hash:hash});
  const info=Array.isArray(pv)?pv[0]:null;
  if(!info){note("Questo invito non è valido, è scaduto o è già stato usato. Chiedi alla coordinatrice un nuovo link.","error");return}
  if(info.already_member){note("Fai già parte del reparto "+info.unit_name+".","");return}
  const {data:unitId,error}=await sb.rpc("accept_unit_invitation",{p_token_hash:hash});
  if(error){note("Invito non accettato: "+error.message,"error");return}
  note("Sei entrata/o nel reparto "+info.unit_name+" come "+(info.staff_role==="oss"?"OSS":"infermiere")+".","");
  window.__joinedUnit=unitId;
 }catch(err){note("Non riesco a verificare l'invito: "+err.message,"error")}
}
async function init(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){location.href="accesso.html";return}
 user=session.user;
 const nv=await NanoNav.loadContext(sb,user);
 NanoNav.render({container:$("sideNav"),page:"reparto",prefs:nv.prefs,ctx:nv.ctx,account:{name:nv.profile.display_name||nv.profile.first_name||user.email,avatar:nv.profile.avatar_url,onLogout:async()=>{await sb.auth.signOut();location.href="accesso.html"}}});
 NanoNav.mountAccount($("headerAccount"),{sb,user,profile:nv.profile});
 await handleUnitInvite();
 await loadMemberships();render();
}
async function loadMemberships(){
 const {data,error}=await sb.rpc("get_my_units");
 if(error){note("Non riesco a caricare i reparti: "+error.message,"error");units=[];unit=null;return}
 units=data||[];
 const ok=myUnits();
 const jn=window.__joinedUnit?ok.find(m=>m.unit_id===window.__joinedUnit):null;window.__joinedUnit=null;
 if(jn)unit={id:jn.unit_id,name:jn.name};
 else if(!unit||!ok.some(m=>m.unit_id===unit.id))unit=ok[0]?{id:ok[0].unit_id,name:ok[0].name}:null;
 if(unit)await loadMonth();
}
async function loadMonth(){
 const [from,to]=range();
 const [a,s,r]=await Promise.all([
  sb.from("unit_availability").select("day,choice,review_status").eq("unit_id",unit.id).eq("user_id",user.id).gte("day",from).lte("day",to),
  sb.from("unit_shifts").select("user_id,shift_date,code").eq("unit_id",unit.id).eq("published",true).gte("shift_date",from).lte("shift_date",to),
  sb.rpc("get_unit_roster_with_phone",{p_unit:unit.id})
 ]);
 const {data:swapData,error:swapError}=await sb.from("unit_shift_swap_requests").select("*").eq("unit_id",unit.id).order("created_at",{ascending:false}).limit(30);
 const errs=[a.error,s.error,r.error,swapError].filter(Boolean).map(e=>e.message);
 if(errs.length)note("Errore di caricamento: "+errs.join(" · "),"error");
 avail={};orig={};review={};
 (a.data||[]).forEach(x=>{avail[x.day]=x.choice;orig[x.day]=x.choice;review[x.day]=x.review_status});
 rosterContacts=r.data||[];const names={};rosterContacts.forEach(x=>{names[x.user_id]=x.display_name});
 schedule=(s.data||[]).map(x=>({user_id:x.user_id,day:x.shift_date,code:x.code,display_name:names[x.user_id]||"Collega"}));swapRequests=swapData||[];
}
function joinCard(){
 const pending=units.filter(m=>m.unit_role==="nurse"&&m.status!=="active").map(m=>'<div class="item"><span><b>'+safe(m.name)+'</b></span><span class="muted">In attesa di approvazione</span></div>').join("");
 return '<section class="panel"><h2>Entra in un reparto</h2><p class="muted">Apri il link personale ricevuto dalla coordinatrice oppure inserisci qui il codice del reparto. Con il codice potrai indicare le disponibilità dopo la sua approvazione.</p><form id="joinForm" class="row"><div class="field"><label for="code">Codice reparto</label><input id="code" maxlength="8" autocapitalize="characters" autocomplete="off" required placeholder="Es. K7M2QX9A"></div><div class="field"><label for="joinRole">Il tuo ruolo</label><select id="joinRole"><option value="infermiere">Infermiere</option><option value="oss">OSS</option></select></div><button class="btn" type="submit">Invia richiesta</button></form>'+(pending?'<div style="margin-top:12px">'+pending+'</div>':"")+'</section>';
}
function availView(){
 const y=cursor.getFullYear(),m=cursor.getMonth();let h='<div id="availabilityGrid">';
 for(let d=1;d<=dim();d++){
  const key=ymd(y,m,d),wd=new Date(y,m,d).getDay(),cur=avail[key]||"ANY",lock=locked(key);
  h+='<div class="day'+(wd===0||wd===6?" we":"")+(avail[key]!==orig[key]?" dirty":"")+'"><div class="d"><span>'+WD[wd]+'</span><span>'+d+'</span></div><div class="chips">'+PREFS.map(([v,l,cls])=>'<button type="button" class="chip '+cls+(cur===v?" on":"")+'" data-day="'+key+'" data-pref="'+v+'"'+(lock?" disabled":"")+'>'+l+'</button>').join("")+'</div>'+(lock?'<span class="lock">✓ Confermata</span>':review[key]==="rejected"?'<span class="lock" style="color:var(--red)">Da modificare</span>':"")+'</div>';
 }
 h+='</div>';
 return '<section class="panel"><h2>Le tue disponibilità</h2><p class="muted">Tocca una scelta per ogni giorno. Le date già confermate dalla coordinatrice sono bloccate.</p>'+h+'<div class="savebar"><button class="btn" id="saveAvail"'+(dirty()&&!busy?"":" disabled")+'>'+(busy?"Salvataggio…":"Salva disponibilità")+'</button><select id="fillPref" class="inline" style="width:auto"><option value="">Imposta i giorni non confermati…</option>'+PREFS.map(([v,l])=>'<option value="'+v+'">'+l+'</option>').join("")+'</select>'+(dirty()?'<span class="muted">Modifiche non salvate</span>':"")+'</div></section>';
}
function scheduleView(){
 const y=cursor.getFullYear(),m=cursor.getMonth(),n=dim();
 if(!schedule.length)return '<section class="panel"><h2>Turni del reparto</h2><p class="muted">La coordinatrice non ha ancora pubblicato i turni di questo mese.</p></section>';
 const mine=schedule.filter(r=>r.user_id===user.id).sort((a,b)=>a.day.localeCompare(b.day));
 const people=[...new Map(schedule.map(r=>[r.user_id,r.display_name])).entries()].sort((a,b)=>(a[0]===user.id?-1:b[0]===user.id?1:String(a[1]).localeCompare(String(b[1]),"it")));
 const by={};schedule.forEach(r=>{by[r.user_id+"|"+r.day]=r.code});
 let head="<tr><th>Persona</th>";for(let d=1;d<=n;d++){const wd=new Date(y,m,d).getDay();head+='<th class="'+(wd===0||wd===6?"we":"")+'">'+d+"</th>"}head+="</tr>";
 const body=people.map(([id,name])=>'<tr class="'+(id===user.id?"me":"")+'"><td>'+safe(name)+(id===user.id?" (tu)":"")+"</td>"+Array.from({length:n},(_,i)=>{const c=by[id+"|"+ymd(y,m,i+1)];return "<td>"+(c?'<span class="pill '+c+'">'+c+"</span>":"")+"</td>"}).join("")+"</tr>").join("");
 const HRS={M:7,P:5,G:12,N:12,R:0},TXT={M:"Mattina",P:"Pomeriggio",G:"Giornata",N:"Notte",R:"Riposo"},today=ymd(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());
 const mineBy={};mine.forEach(r=>{mineBy[r.day]=r.code});
 const cnt={M:0,P:0,G:0,N:0,R:0};mine.forEach(r=>{if(cnt[r.code]!==undefined)cnt[r.code]++});
 const hours=mine.reduce((a,r)=>a+(HRS[r.code]||0),0),worked=mine.filter(r=>r.code!=="R").length;
 const next=mine.find(r=>r.day>=today&&r.code!=="R");
 const lead=(new Date(y,m,1).getDay()+6)%7;
 let grid=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"].map(w=>'<div class="mh">'+w+'</div>').join("")+'<div class="mc empty"></div>'.repeat(lead);
 for(let d=1;d<=n;d++){const k=ymd(y,m,d),c=mineBy[k],wd=new Date(y,m,d).getDay();
  grid+='<div class="mc'+(k===today?" today":"")+(wd===0||wd===6?" we":"")+(c?" has":"")+'"><span class="dn">'+d+'</span>'+(c?'<span class="pill '+c+'" title="'+TXT[c]+'">'+c+'</span><span class="tm">'+(c==="R"?"Riposo":SHIFT[c][0].slice(0,2)+"–"+SHIFT[c][1].slice(0,2))+'</span>':"")+'</div>'}
 const chips=["M","P","G","N","R"].filter(c=>cnt[c]).map(c=>'<span class="sumchip"><span class="pill '+c+'">'+c+'</span> '+cnt[c]+' '+TXT[c].toLowerCase()+'</span>').join("");
 const list='<div class="mysum"><div><b>'+worked+'</b><span>giorni di lavoro</span></div><div><b>'+hours+' h</b><span>ore programmate</span></div><div><b>'+(next?new Date(next.day+"T12:00:00").toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"})+" · "+next.code:"—")+'</b><span>prossimo turno</span></div></div>'+(mine.length?'<div class="sumchips">'+chips+'</div><div class="mgrid" role="grid" aria-label="I tuoi turni del mese">'+grid+'</div>':'<p class="muted">Nessun turno assegnato a te questo mese.</p>');
 return '<section class="panel"><h2>I tuoi turni</h2>'+list+(mine.length?'<div class="savebar"><button class="btn" id="importShifts">Importa nel mio calendario</button> <button class="btn danger" id="removeImportedShifts">Rimuovi turni importati</button></div><p class="muted">Puoi rimuovere dal calendario personale solo i turni importati da questo reparto; gli altri turni resteranno invariati.</p>':"")+'</section><section class="panel"><h2>Turni del reparto</h2><div class="scroll"><table>'+head+body+'</table></div></section>';
}
function whatsappUrl(phone){let raw=String(phone||"").trim();if(!raw)return "";let n=raw.replace(/[^0-9]/g,"");if(!n)return "";if(raw.startsWith("+")){}else if(raw.startsWith("00")){n=n.slice(2)}else if(!/^(39|1|44|380|33|49|34|41|43|351|30|48|40|359|420|421|385|386|36|31|32|45|46|47|358|353|90|7|373|995|972|971|20|212|27|91|86|81|82|61|55|54|52)/.test(n)){n="39"+n}return "https://wa.me/"+n}
function contactsView(){return '<section class="panel"><h2>Contatta i colleghi</h2><p class="muted">Il pulsante WhatsApp compare quando il collega ha inserito il numero nel proprio profilo.</p>'+rosterContacts.filter(m=>m.status==="active"&&m.user_id!==user.id).map(m=>{const url=whatsappUrl(m.phone);return '<div class="item"><span><b>'+safe(m.display_name)+'</b> <small class="muted">'+(m.staff_role==="oss"?"OSS":"Infermiere")+'</small></span>'+(url?'<a class="btn secondary" target="_blank" rel="noopener" href="'+url+'">WhatsApp</a>':'<span class="muted">Numero non inserito</span>')+'</div>'}).join("")+'</section>'}

function swapView(){
 const mine=schedule.filter(s=>s.user_id===user.id);
 const peers=[...new Map(schedule.filter(s=>s.user_id!==user.id).map(s=>[s.user_id,s.display_name])).entries()];
 let h="<section class='panel'><h2>Cambio turno</h2><p class='muted'>Proponi uno scambio tra turni pubblicati. Il calendario si aggiorna solo se il collega accetta.</p><form id='swapForm' class='row'><div class='field'><label for='swapMine'>Il mio turno</label><select id='swapMine' required><option value=''>Scegli data</option>";
 mine.forEach(s=>h+="<option value='"+s.day+"'>"+s.day+" · "+s.code+"</option>");
 h+="</select></div><div class='field'><label for='swapTarget'>Collega</label><select id='swapTarget' required><option value=''>Scegli collega</option>";
 peers.forEach(p=>h+="<option value='"+p[0]+"'>"+safe(p[1])+"</option>");
 h+="</select></div><div class='field'><label for='swapTargetDate'>Turno del collega</label><select id='swapTargetDate' required><option value=''>Scegli prima il collega</option></select></div><div class='field'><label for='swapMessage'>Messaggio (facoltativo)</label><input id='swapMessage' maxlength='300'></div><button class='btn' type='submit'>Invia richiesta</button></form><div class='small-list'>";
 swapRequests.filter(s=>s.requester_id===user.id||s.target_id===user.id).forEach(s=>{const other=rosterContacts.find(m=>m.user_id===(s.requester_id===user.id?s.target_id:s.requester_id));h+="<div class='item'><span><b>"+(s.requester_id===user.id?"A ":"Da ")+safe(other?.display_name||"collega")+"</b><br><small class='muted'>"+s.requester_shift_date+" ↔ "+s.target_shift_date+" · "+s.status+"</small></span>";if(s.target_id===user.id&&s.status==="pending")h+="<span><button type='button' data-swap-accept='"+s.id+"'>Accetta</button> <button type='button' data-swap-decline='"+s.id+"'>Rifiuta</button></span>";h+="</div>"});
 return h+"</div></section>";
}

function render(){
 const app=$("app");
 let h='<h1>'+(unit?safe(unit.name):"Reparto")+'</h1><div class="muted">Disponibilità e turni pubblicati dalla coordinatrice.</div>';
 if(msg)h+='<div class="notice '+msg.type+'" role="status">'+safe(msg.t)+'</div>';
 const ok=myUnits();
 if(ok.length>1)h+='<div class="field" style="margin-top:10px"><label for="wardSel">Reparto</label><select id="wardSel">'+ok.map(m=>'<option value="'+m.unit_id+'"'+(unit&&m.unit_id===unit.id?" selected":"")+'>'+safe(m.name)+'</option>').join("")+'</select></div>';
 if(!unit){
  if(units.some(m=>m.unit_role==="coordinator"&&m.status==="active"))h+='<div class="notice warn">Sei coordinatrice di un reparto: gestiscilo dall\'<a href="coordinamento.html">area coordinamento</a>.</div>';
  h+=joinCard();app.innerHTML=h;bind();return
 }
 h+='<div class="tabs"><button data-tab="avail" class="'+(tab==="avail"?"active":"")+'">Disponibilità</button><button data-tab="sched" class="'+(tab==="sched"?"active":"")+'">Turni pubblicati</button></div>';
 h+='<div class="monthnav"><button data-month="-1" aria-label="Mese precedente">‹</button><strong>'+cursor.toLocaleDateString("it-IT",{month:"long",year:"numeric"})+'</strong><button data-month="1" aria-label="Mese successivo">›</button></div>';
 h+=tab==="avail"?availView():scheduleView();
 if(tab==="sched")h+=swapView();
 h+=contactsView();
 h+=joinCard().replace('<section class="panel"><h2>Entra in un reparto</h2>','<section class="panel"><h2>Entra in un altro reparto</h2>');
 app.innerHTML=h;bind();
}
function bind(){
 const jf=$("joinForm");if(jf)jf.onsubmit=async e=>{
  e.preventDefault();const {error}=await sb.rpc("request_join_unit",{p_code:$("code").value,p_staff_role:$("joinRole").value});
  if(error)note(error.message,"error");else note("Richiesta inviata: attendi l'approvazione della coordinatrice.","");
  await loadMemberships();render();
 };
 const ws=$("wardSel");if(ws)ws.onchange=async()=>{const m=units.find(x=>x.unit_id===ws.value);unit={id:m.unit_id,name:m.name};note(null);await loadMonth();render()};
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 document.querySelectorAll("[data-month]").forEach(b=>b.onclick=async()=>{
  if(dirty()&&!confirm("Hai modifiche non salvate. Vuoi cambiare mese e perderle?"))return;
  cursor=new Date(cursor.getFullYear(),cursor.getMonth()+Number(b.dataset.month),1);note(null);await loadMonth();render();
 });
 document.querySelectorAll(".chip[data-day]").forEach(b=>b.onclick=()=>{avail[b.dataset.day]=b.dataset.pref;const y=window.scrollY;render();window.scrollTo(0,y)});
 const fill=$("fillPref");if(fill)fill.onchange=()=>{if(!fill.value)return;for(let d=1;d<=dim();d++){const k=ymd(cursor.getFullYear(),cursor.getMonth(),d);if(!locked(k))avail[k]=fill.value}render()};
 const sv=$("saveAvail");if(sv)sv.onclick=saveAvail;
 const im=$("importShifts");if(im)im.onclick=importShifts;

 const swapTarget=$("swapTarget");if(swapTarget)swapTarget.onchange=()=>{const options=schedule.filter(s=>s.user_id===swapTarget.value);$("swapTargetDate").innerHTML="<option value=''>Scegli data</option>"+options.map(s=>"<option value='"+s.day+"'>"+s.day+" · "+s.code+"</option>").join("")};
 const swapForm=$("swapForm");if(swapForm)swapForm.onsubmit=async e=>{e.preventDefault();const {error}=await sb.rpc("create_unit_shift_swap",{p_unit:unit.id,p_target:$("swapTarget").value,p_requester_date:$("swapMine").value,p_target_date:$("swapTargetDate").value,p_message:$("swapMessage").value});if(error)note("Richiesta non inviata: "+error.message,"error");else note("Richiesta di cambio turno inviata.","");await loadMonth();render()};
 document.querySelectorAll("[data-swap-accept],[data-swap-decline]").forEach(b=>b.onclick=async()=>{const {error}=await sb.rpc("respond_unit_shift_swap",{p_request:b.dataset.swapAccept||b.dataset.swapDecline,p_accept:!!b.dataset.swapAccept});if(error)note("Cambio turno non completato: "+error.message,"error");else note(b.dataset.swapAccept?"Cambio turno confermato.":"Richiesta rifiutata.","");await loadMonth();render()});

 const rm=$("removeImportedShifts");if(rm)rm.onclick=removeImportedShifts;
}
async function saveAvail(){
 const rows=Object.keys(avail).filter(d=>avail[d]!==orig[d]&&!locked(d)).map(d=>({unit_id:unit.id,user_id:user.id,day:d,choice:avail[d],review_status:"pending",updated_at:new Date().toISOString()}));
 if(!rows.length)return;
 busy=true;render();
 const {error}=await sb.from("unit_availability").upsert(rows,{onConflict:"unit_id,user_id,day"});
 busy=false;
 if(error)note("Salvataggio non riuscito: "+error.message,"error");else note("Disponibilità salvate.","");
 await loadMonth();render();
}
async function removeImportedShifts(){
 const [from,to]=range(),prefix="Reparto: "+unit.name;
 if(!confirm("Vuoi eliminare dal tuo calendario personale i turni importati da questo reparto per "+cursor.toLocaleDateString("it-IT",{month:"long",year:"numeric"})+"? Gli altri turni personali non verranno modificati."))return;
 const {data,error}=await sb.from("shifts").select("id,notes").eq("user_id",user.id).gte("shift_date",from).lte("shift_date",to);
 if(error){note("Non riesco a caricare i turni da rimuovere: "+error.message,"error");render();return}
 const ids=(data||[]).filter(r=>String(r.notes||"").startsWith(prefix)).map(r=>r.id);
 if(!ids.length){note("Non ci sono turni importati da questo reparto nel mese selezionato.","warn");render();return}
 const {error:delError}=await sb.from("shifts").delete().eq("user_id",user.id).in("id",ids);
 if(delError)note("Eliminazione non riuscita: "+delError.message,"error");
 else note("Eliminati "+ids.length+" turni importati da "+unit.name+". Gli altri turni personali sono rimasti invariati.","");
 await loadMonth();render();
}
async function importShifts(){
 const [from,to]=range(),mine=schedule.filter(r=>r.user_id===user.id);
 const {data:existing,error:e1}=await sb.from("shifts").select("shift_date").eq("user_id",user.id).gte("shift_date",from).lte("shift_date",to);
 if(e1){note("Importazione non riuscita: "+e1.message,"error");render();return}
 const taken=new Set((existing||[]).map(r=>r.shift_date));
 const rows=mine.filter(r=>!taken.has(r.day)).map(r=>({user_id:user.id,shift_date:r.day,code:r.code,start_time:SHIFT[r.code][0],end_time:SHIFT[r.code][1],actual_hours:r.code==="R"?0:null,availability_hours:0,notes:"Reparto: "+unit.name,updated_at:new Date().toISOString()}));
 if(!rows.length){note("Tutti i turni sono già nel tuo calendario.","warn");render();return}
 const {error}=await sb.from("shifts").insert(rows);
 if(error)note("Importazione non riuscita: "+error.message,"error");
 else note("Importati "+rows.length+" turni nel tuo calendario"+(mine.length>rows.length?" ("+(mine.length-rows.length)+" già presenti, saltati).":"."),"");
 render();
}
window.addEventListener("beforeunload",e=>{if(dirty()){e.preventDefault();e.returnValue=""}});
init();
</script>

<script>
(function(){
 const baseRender=render;
 render=function(){
  baseRender();
  if(tab!=="sched"||!unit)return;
  const mine=schedule.filter(s=>s.user_id===user.id);
  const peers=[...new Map(schedule.filter(s=>s.user_id!==user.id).map(s=>[s.user_id,s.display_name])).entries()];
  let html="<section class='panel'><h2>Cambio turno</h2><p class='muted'>Proponi uno scambio tra turni pubblicati. Il calendario si aggiorna solo se il collega accetta.</p><form id='swapForm' class='row'><div class='field'><label for='swapMine'>Il mio turno</label><select id='swapMine' required><option value=''>Scegli data</option>";
  mine.forEach(s=>html+="<option value='"+s.day+"'>"+s.day+" · "+s.code+"</option>");
  html+="</select></div><div class='field'><label for='swapTarget'>Collega</label><select id='swapTarget' required><option value=''>Scegli collega</option>";
  peers.forEach(p=>html+="<option value='"+p[0]+"'>"+safe(p[1])+"</option>");
  html+="</select></div><div class='field'><label for='swapTargetDate'>Turno del collega</label><select id='swapTargetDate' required><option value=''>Scegli prima il collega</option></select></div><div class='field'><label for='swapMessage'>Messaggio (facoltativo)</label><input id='swapMessage' maxlength='300'></div><button class='btn' type='submit'>Invia richiesta</button></form><div class='small-list'>";
  swapRequests.filter(s=>s.requester_id===user.id||s.target_id===user.id).forEach(s=>{const other=rosterContacts.find(m=>m.user_id===(s.requester_id===user.id?s.target_id:s.requester_id));html+="<div class='item'><span><b>"+(s.requester_id===user.id?"A ":"Da ")+safe(other?.display_name||"collega")+"</b><br><small class='muted'>"+s.requester_shift_date+" ↔ "+s.target_shift_date+" · "+s.status+"</small></span>";if(s.target_id===user.id&&s.status==="pending")html+="<span><button type='button' data-swap-accept='"+s.id+"'>Accetta</button> <button type='button' data-swap-decline='"+s.id+"'>Rifiuta</button></span>";html+="</div>"});
  const app=document.getElementById("app");app.insertAdjacentHTML("beforeend",html+"</div></section>");
 };
 document.addEventListener("change",e=>{if(e.target.id!=="swapTarget")return;const opts=schedule.filter(s=>s.user_id===e.target.value);document.getElementById("swapTargetDate").innerHTML="<option value=''>Scegli data</option>"+opts.map(s=>"<option value='"+s.day+"'>"+s.day+" · "+s.code+"</option>").join("")});
 document.addEventListener("submit",async e=>{if(e.target.id!=="swapForm")return;e.preventDefault();const {error}=await sb.rpc("create_unit_shift_swap",{p_unit:unit.id,p_target:document.getElementById("swapTarget").value,p_requester_date:document.getElementById("swapMine").value,p_target_date:document.getElementById("swapTargetDate").value,p_message:document.getElementById("swapMessage").value});if(error)note("Richiesta non inviata: "+error.message,"error");else note("Richiesta di cambio turno inviata.","");await loadMonth();render()});
 document.addEventListener("click",async e=>{const b=e.target.closest("[data-swap-accept],[data-swap-decline]");if(!b)return;const {error}=await sb.rpc("respond_unit_shift_swap",{p_request:b.dataset.swapAccept||b.dataset.swapDecline,p_accept:!!b.dataset.swapAccept});if(error)note("Cambio turno non completato: "+error.message,"error");else note(b.dataset.swapAccept?"Cambio turno confermato.":"Richiesta rifiutata.","");await loadMonth();render()});
})();
</script>
