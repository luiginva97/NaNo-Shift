<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb"><title>NaNoShift · Accedi</title><link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png"><link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;--navy:#102b4e;--blue:#1769c2;--gold:#f2bd36;--ink:#19324e;--muted:#718198;--line:#dce5ef;--bg:#f3f6fa;--red:#b42318;--green:#16845b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:30px 16px;background:linear-gradient(145deg,#edf4fb,#f8f9fb 55%,#fff8e8);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);display:grid;place-items:center}
.shell{width:min(100%,480px)}.brand{text-align:center;margin-bottom:20px}.mark{display:block;width:min(100%,360px);height:auto;object-fit:contain;margin:0 auto 9px;border-radius:0;background:transparent;box-shadow:none}.brand-name,.tagline{display:none}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:27px;box-shadow:0 18px 55px #17324f12}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;gap:5px;background:#f0f4f8;border-radius:12px;margin-bottom:23px}.tab{border:0;background:transparent;border-radius:9px;padding:11px;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}.tab[aria-selected=true]{background:#fff;color:var(--navy);box-shadow:0 2px 8px #1c355014}
.field{margin-top:15px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input{width:100%;height:46px;padding:10px 12px;border:1px solid #cfdbe8;border-radius:10px;font:inherit;color:var(--ink);background:#fff}.field input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px #1769c21a}.password-wrap{position:relative}.password-wrap input{padding-right:49px}.eye{position:absolute;right:7px;top:6px;width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:#64758b;display:grid;place-items:center;cursor:pointer}.eye:hover{background:#f0f4f8;color:var(--navy)}.eye svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:12px;color:var(--muted);margin:7px 0 0}.requirements{display:grid;gap:5px;margin:10px 0 0;padding:11px 12px;border:1px solid #e5ebf2;border-radius:10px;background:#fafbfd}.req{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.req::before{content:"";width:7px;height:7px;border:1.5px solid #9aa8b8;border-radius:50%;flex:none}.req.ok{color:var(--green)}.req.ok::before{background:var(--green);border-color:var(--green)}.match{font-size:12px;margin:6px 0 0;color:var(--muted)}.match.ok{color:var(--green)}.match.bad{color:var(--red)}
.primary{width:100%;margin-top:22px;border:0;border-radius:11px;padding:13px 16px;background:var(--navy);color:#fff;font:inherit;font-weight:800;cursor:pointer}.primary:hover{background:#17416f}.primary:disabled{opacity:.6;cursor:wait}.links{display:flex;justify-content:flex-end;margin-top:15px;font-size:13px}.link{border:0;background:none;color:var(--blue);font:inherit;font-weight:700;cursor:pointer;padding:0}.link:hover{text-decoration:underline}.message{display:none;padding:12px 13px;border-radius:10px;margin-top:16px;font-size:13px;overflow-wrap:anywhere}.message.show{display:block}.message.info{background:#edf5ff;color:#174c7d;border:1px solid #d7e8fa}.message.error{background:#fff1f0;color:var(--red);border:1px solid #f3d5d2}.foot{text-align:center;color:var(--muted);font-size:11px;margin:16px 8px 0}[hidden]{display:none!important}
@media(max-width:520px){body{padding:18px 12px}.card{padding:21px}.brand{margin-bottom:15px}}
</style></head><body><main class="shell">
<header class="brand"><img class="mark" src="nanoshift-logo.png" alt="NaNoShift — I tuoi turni, sempre con te"><div class="brand-name">NaNo<span>Shift</span></div><p class="tagline">I tuoi turni, sempre con te</p></header>
<section class="card" aria-label="Accesso e registrazione">
<div class="tabs" role="tablist"><button class="tab" id="loginTab" type="button" role="tab" aria-selected="true">Accedi</button><button class="tab" id="signupTab" type="button" role="tab" aria-selected="false">Crea account</button></div>
<form id="authForm" novalidate>
<div id="nameWrap" hidden><div class="field"><label for="firstName">Nome</label><input id="firstName" autocomplete="given-name" maxlength="60" placeholder="Il tuo nome"></div><div class="field"><label for="lastName">Cognome</label><input id="lastName" autocomplete="family-name" maxlength="60" placeholder="Il tuo cognome"></div></div>
<div class="field"><label for="email">Indirizzo email</label><input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="nome@esempio.it"></div>
<div class="field" id="passwordWrap"><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="Inserisci la password"><button class="eye" type="button" data-eye="password" aria-label="Mostra password" title="Mostra password"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
<div id="passwordRules" class="requirements" hidden><div class="req" data-rule="length">Almeno 8 caratteri</div><div class="req" data-rule="upper">Una lettera maiuscola</div><div class="req" data-rule="lower">Una lettera minuscola</div><div class="req" data-rule="number">Un numero</div></div>
<div class="field" id="confirmWrap" hidden><label for="confirmPassword">Conferma password</label><div class="password-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" maxlength="128" placeholder="Ripeti la password"><button class="eye" type="button" data-eye="confirmPassword" aria-label="Mostra conferma password" title="Mostra password"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><p id="matchHint" class="match" aria-live="polite"></p></div>
<button class="primary" id="submitBtn" type="submit">Accedi</button>
</form>
<div class="links"><button class="link" id="forgotLink" type="button">Hai dimenticato la password?</button><button class="link" id="backToLogin" type="button" hidden>Torna all'accesso</button></div>
<div id="message" class="message" role="status" aria-live="polite"></div>
</section><p class="foot">Accesso riservato · Non inserire dati clinici dei pazienti</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script>
const SUPABASE_URL="https://mmkdibdomjaxwqfryqcw.supabase.co",SUPABASE_KEY="sb_publishable_QPArC4ARilfFLqxnNsV72A_UBzZN-5g",APP_URL="https://nanoshift.pages.dev";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id),form=$("authForm"),email=$("email"),password=$("password"),confirmPassword=$("confirmPassword"),submit=$("submitBtn"),message=$("message");
let mode="login",recoveryMode=false;
function msg(t,type="info"){message.textContent=t;message.className="message show "+type}
function clearMsg(){message.textContent="";message.className="message"}
function passwordChecks(v){return {length:v.length>=8,upper:/[A-Z]/.test(v),lower:/[a-z]/.test(v),number:/[0-9]/.test(v)}}
function updateRules(){const c=passwordChecks(password.value);Object.entries(c).forEach(([k,ok])=>document.querySelector('[data-rule="'+k+'"]').classList.toggle("ok",ok));const same=confirmPassword.value===password.value&&confirmPassword.value.length>0;$("matchHint").textContent=confirmPassword.value?(same?"Le password coincidono.":"Le password non coincidono."):"";$("matchHint").className="match "+(same?"ok":"bad")}
function setMode(next){mode=next;recoveryMode=false;$("loginTab").hidden=false;$("signupTab").hidden=false;$("loginTab").setAttribute("aria-selected",String(next==="login"));$("signupTab").setAttribute("aria-selected",String(next==="signup"));$("nameWrap").hidden=next!=="signup";$("confirmWrap").hidden=next!=="signup";$("passwordRules").hidden=next!=="signup";$("firstName").required=next==="signup";$("lastName").required=next==="signup";confirmPassword.required=next==="signup";$("forgotLink").hidden=next!=="login";$("backToLogin").hidden=next!=="signup";$("submitBtn").textContent=next==="signup"?"Crea account":"Accedi";password.autocomplete=next==="signup"?"new-password":"current-password";clearMsg()}
document.querySelectorAll("[data-eye]").forEach(b=>b.addEventListener("click",()=>{const el=$(b.dataset.eye),show=el.type==="password";el.type=show?"text":"password";b.setAttribute("aria-label",show?"Nascondi password":"Mostra password");b.title=show?"Nascondi password":"Mostra password"}));
password.addEventListener("input",updateRules);confirmPassword.addEventListener("input",updateRules);
$("loginTab").onclick=()=>setMode("login");$("signupTab").onclick=()=>setMode("signup");$("backToLogin").onclick=()=>setMode("login");
$("forgotLink").onclick=async()=>{clearMsg();const address=email.value.trim().toLowerCase();if(!address){msg("Inserisci prima il tuo indirizzo email.","error");email.focus();return}try{const {error}=await sb.auth.resetPasswordForEmail(address,{redirectTo:APP_URL+"/accesso.html"});if(error)throw error;msg("Se l'indirizzo è registrato, riceverai un'email con il link per reimpostare la password.")}catch(e){msg(e.message||"Non è stato possibile inviare l'email.","error")}};
form.addEventListener("submit",async e=>{e.preventDefault();clearMsg();submit.disabled=true;try{
const address=email.value.trim().toLowerCase(),pass=password.value;
if(recoveryMode){if(!Object.values(passwordChecks(pass)).every(Boolean))throw Error("La nuova password non rispetta tutti i requisiti.");if(pass!==confirmPassword.value)throw Error("Le password non coincidono.");const {error}=await sb.auth.updateUser({password:pass});if(error)throw error;msg("Password aggiornata. Ora puoi accedere.");setMode("login");password.value="";confirmPassword.value="";return}
if(mode==="signup"){if(!$("firstName").value.trim()||!$("lastName").value.trim())throw Error("Inserisci nome e cognome.");if(!Object.values(passwordChecks(pass)).every(Boolean))throw Error("Completa tutti i requisiti della password.");if(pass!==confirmPassword.value)throw Error("Le password non coincidono.");const {data,error}=await sb.auth.signUp({email:address,password:pass,options:{data:{first_name:$("firstName").value.trim(),last_name:$("lastName").value.trim(),display_name:($("firstName").value.trim()+" "+$("lastName").value.trim())}}});if(error)throw error;if(data.session){msg("Account creato. Accesso in corso…");setTimeout(()=>location.href="dashboard.html",700)}else throw Error("Supabase sta ancora richiedendo la conferma email. Disattiva Conferma email nelle impostazioni di autenticazione del progetto e riprova.")}else{const {data,error}=await sb.auth.signInWithPassword({email:address,password:pass});if(error)throw error;const {data:p,error:pe}=await sb.from("profiles").select("display_name,role").eq("id",data.user.id).single();if(pe||!p||!["admin","nurse"].includes(p.role)){await sb.auth.signOut();throw Error("Il profilo non è ancora configurato. Contatta l'amministratrice.")}location.href="dashboard.html"+(new URLSearchParams(location.search).has("invite")?"?invite="+encodeURIComponent(new URLSearchParams(location.search).get("invite")):"")}}
catch(e){msg(e.message||"Si è verificato un errore. Riprova.","error")}finally{submit.disabled=false}});
(async()=>{const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.replace(/^#/,""));if(params.get("error_description")||hash.get("error_description")){msg("Il link non è valido o è scaduto. Richiedi una nuova email.","error");return}if(hash.get("type")==="recovery"){recoveryMode=true;setMode("signup");$("loginTab").hidden=true;$("signupTab").hidden=true;$("nameWrap").hidden=true;$("passwordRules").hidden=false;$("confirmWrap").hidden=false;$("forgotLink").hidden=true;$("backToLogin").hidden=false;$("submitBtn").textContent="Salva nuova password";msg("Scegli una nuova password per il tuo account.");return}if(params.has("code")||hash.has("access_token")){const {data}=await sb.auth.getSession();if(data.session){msg("Indirizzo email confermato. Accesso in corso…");setTimeout(()=>location.href="dashboard.html",1000)}else msg("Indirizzo email confermato. Ora accedi con la tua email e password.")}})();
</script></body></html>
