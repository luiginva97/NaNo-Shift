<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NaNoShift · CV condivisi</title><style>body{margin:0;background:#f3f6fa;color:#19324e;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:800px;margin:auto;padding:22px 15px}.panel{background:#fff;border:1px solid #dce5ef;border-radius:15px;padding:20px;margin-bottom:14px}h1{font-size:22px;margin:0 0 12px}.muted{color:#718198}select{padding:10px;border:1px solid #cfdbe8;border-radius:8px;min-width:230px}.btn{padding:10px 14px;border:0;border-radius:9px;background:#102b4e;color:white;font-weight:700;cursor:pointer}.item{padding:13px 0;border-top:1px solid #dce5ef}.item:first-child{border:0}.item a{color:#1769c2;font-weight:700}</style></head><body><main class="wrap"><section class="panel"><a href="coordinamento.html">← Torna al coordinamento</a><h1>CV condivisi dal personale</h1><p class="muted">Qui compaiono soltanto i CV che i membri del reparto hanno scelto di condividere. I link scadono dopo 5 minuti.</p><select id="unit"></select> <button id="load" class="btn">Carica CV</button><div id="status" class="muted"></div></section><section class="panel"><div id="cvs">Seleziona un reparto.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script>
const sb=window.supabase.createClient("https://mmkdibdomjaxwqfryqcw.supabase.co","sb_publishable_QPArC4ARilfFLqxnNsV72A_UBzZN-5g");const $=id=>document.getElementById(id);let session;
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function invoke(action,extra){const r=await fetch("https://mmkdibdomjaxwqfryqcw.supabase.co/functions/v1/nanoshift-admin",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,apikey:"sb_publishable_QPArC4ARilfFLqxnNsV72A_UBzZN-5g","Content-Type":"application/json"},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||"Errore");return d}
async function init(){const {data:{session:s}}=await sb.auth.getSession();if(!s){location.href="accesso.html";return}session=s;const {data,error}=await sb.rpc("get_my_units");if(error){$("status").textContent=error.message;return}const units=(data||[]).filter(x=>x.unit_role==="coordinator"&&x.status==="active");$("unit").innerHTML=units.map(u=>'<option value="'+u.unit_id+'">'+esc(u.unit_name||u.name||"Reparto")+'</option>').join("");if(!units.length){$("status").textContent="Non risulti coordinatrice di alcun reparto.";return}load()}
async function load(){try{const d=await invoke("list_visible_cvs",{unit_id:$("unit").value});$("cvs").innerHTML=(d.cvs||[]).map(x=>'<div class="item"><b>'+esc(x.name||"Utente")+'</b><p><a href="'+x.url+'" target="_blank" rel="noopener">Apri curriculum</a></p></div>').join("")||'<p class="muted">Nessun CV condiviso per questo reparto.</p>';$("status").textContent="Elenco aggiornato."}catch(e){$("status").textContent=e.message}}
$("load").onclick=load;init();
</script></body></html>
