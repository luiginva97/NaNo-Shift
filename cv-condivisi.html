<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NaNoShift · Documenti personale</title><style>:root{--navy:#10284b;--blue:#2463eb;--pale:#edf3ff;--line:#dfe6f1;--muted:#68778f;--red:#b42318}body.has-nav .wrap{max-width:900px}.person{border:1px solid #dce5ef;border-radius:14px;margin-bottom:10px;background:#fff;overflow:hidden}.person>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:800}.person>summary::-webkit-details-marker{display:none}.person>summary .fo{width:34px;height:28px;border-radius:7px;background:#f2bd36;flex:none;position:relative}.person>summary .fo:before{content:'';position:absolute;left:0;top:-5px;width:14px;height:7px;border-radius:5px 5px 0 0;background:#f2bd36}.person>summary small{display:block;font-weight:600;color:#718198}.person>summary .ch{margin-left:auto;color:#718198;transition:transform .15s}.person[open]>summary .ch{transform:rotate(90deg)}.pbody{padding:4px 16px 16px;border-top:1px solid #edf1f6}.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;margin:12px 0}.kvs div{font-size:13px}.kvs b{display:block;font-size:12px;color:#718198;font-weight:700}.exp-ok{color:#13845b;font-weight:700}.exp-soon{color:#b7791f;font-weight:700}.exp-bad{color:#b42318;font-weight:700}h3{font-size:14px;margin:14px 0 4px}.dl a{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #edf1f6;text-decoration:none;color:#1769c2;font-weight:700}.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#eef2f8;color:#52627a;font-weight:700}.pill.warn{background:#fdecea;color:#b42318}.top{background:#fff;border:1px solid #dce5ef;border-radius:15px;padding:14px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0}body{margin:0;background:#f3f6fa;color:#19324e;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:800px;margin:auto;padding:22px 15px}.panel{background:#fff;border:1px solid #dce5ef;border-radius:15px;padding:20px;margin-bottom:14px}h1{font-size:22px;margin:0 0 12px}.muted{color:#718198}select{padding:10px;border:1px solid #cfdbe8;border-radius:8px;min-width:230px}.btn{padding:10px 14px;border:0;border-radius:9px;background:#102b4e;color:white;font-weight:700;cursor:pointer}.item{padding:13px 0;border-top:1px solid #dce5ef}.item:first-child{border:0}.item a{color:#1769c2;font-weight:700}</style><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="nav.css"></head><body><nav class="side-nav" id="sideNav" aria-label="Navigazione"></nav><main class="wrap"><header class="top"><h1>Documenti personale</h1><div id="headerAccount"></div></header><section class="panel"><p class="muted">Una cartella per ogni persona del reparto, con dati, scadenze e documenti caricati. Chi disattiva la condivisione non compare con i suoi documenti. I link ai file scadono dopo 5 minuti.</p><select id="unit"></select> <button id="load" class="btn">Aggiorna</button><div id="status" class="muted"></div></section><section class="panel"><div id="cvs">Seleziona un reparto.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script src="nav.js"></script><script>
const sb=window.supabase.createClient("https://mmkdibdomjaxwqfryqcw.supabase.co","sb_publishable_QPArC4ARilfFLqxnNsV72A_UBzZN-5g");const $=id=>document.getElementById(id);let session;
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function invoke(action,extra){const r=await fetch("https://mmkdibdomjaxwqfryqcw.supabase.co/functions/v1/nanoshift-admin",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,apikey:"sb_publishable_QPArC4ARilfFLqxnNsV72A_UBzZN-5g","Content-Type":"application/json"},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||"Errore");return d}
async function initNav(user){try{const nv=await NanoNav.loadContext(sb,user);NanoNav.render({container:$("sideNav"),page:"cvs",customItems:NanoNav.coordItems(nv.prefs).map(i=>i.tab?{...i,tab:false,href:"coordinamento.html?tab="+i.id}:i),active:"cvs",primary:4,prefs:nv.prefs,ctx:nv.ctx,account:{name:nv.profile.display_name||nv.profile.first_name||user.email,avatar:nv.profile.avatar_url,onLogout:async()=>{await sb.auth.signOut();location.href="accesso.html"}}});NanoNav.mountAccount($("headerAccount"),{sb,user,profile:nv.profile})}catch(e){console.error(e)}}
async function init(){const {data:{session:s}}=await sb.auth.getSession();if(!s){location.href="accesso.html";return}session=s;initNav(s.user);const {data,error}=await sb.rpc("get_my_units");if(error){$("status").textContent=error.message;return}const units=(data||[]).filter(x=>x.unit_role==="coordinator"&&x.status==="active");$("unit").innerHTML=units.map(u=>'<option value="'+u.unit_id+'">'+esc(u.unit_name||u.name||"Reparto")+'</option>').join("");if(!units.length){$("status").textContent="Non risulti nel coordinamento di alcun reparto.";return}load()}
const TL={blsd:"Attestato BLSD",order:"Iscrizione Ordine",fire_safety:"Corso antincendio",cv:"Curriculum vitae",id_card:"Documento d’identità",tax_code:"Codice fiscale",other:"Altro"};
const IDT={carta_identita:"Carta d’identità",passaporto:"Passaporto",patente:"Patente",permesso_soggiorno:"Permesso di soggiorno",altro:"Altro"};
const fd=d=>d?new Date(d+"T12:00:00").toLocaleDateString("it-IT"):"—";
function expiry(d){if(!d)return "—";const days=Math.round((new Date(d+"T12:00:00")-Date.now())/864e5),c=days<0?"exp-bad":days<=60?"exp-soon":"exp-ok";return '<span class="'+c+'">'+fd(d)+(days<0?" · scaduto":days<=60?" · tra "+days+" giorni":"")+'</span>'}
const kv=(l,v)=>'<div><b>'+l+'</b>'+(v||"—")+'</div>';
function person(p){
 const role=(p.staff_role==="oss"?"OSS":"Infermiere")+(p.unit_role==="coordinator"?" · coordinamento":"");
 if(!p.shared)return '<details class="person"><summary><span class="fo"></span><span>'+esc(p.name)+'<small>'+role+'</small></span><span class="pill" style="margin-left:auto">Non condivide</span></summary><div class="pbody"><p class="muted">Questa persona ha disattivato la condivisione dei documenti con il coordinamento.</p></div></details>';
 const d=p.data||{},docs=p.docs||[];
 const warn=[d.blsd_expires_on,d.order_expires_on,d.fire_safety_expires_on,d.id_doc_expires_on].filter(x=>x&&new Date(x+"T12:00:00")<Date.now()+60*864e5).length;
 return '<details class="person"><summary><span class="fo"></span><span>'+esc(p.name)+'<small>'+role+' · '+docs.length+' document'+(docs.length===1?"o":"i")+'</small></span>'+(warn?'<span class="pill warn" style="margin-left:auto">'+warn+' in scadenza</span>':'')+'<span class="ch" '+(warn?'':'style="margin-left:auto"')+'>›</span></summary><div class="pbody">'
 +'<h3>Dati</h3><div class="kvs">'+kv("Codice fiscale",esc(d.tax_code))+kv("Matricola",esc(d.employee_number))+kv("N. iscrizione Ordine",esc(d.order_registration_number))+'</div>'
 +'<h3>Scadenze</h3><div class="kvs">'+kv("BLSD",expiry(d.blsd_expires_on))+kv("Iscrizione Albo",expiry(d.order_expires_on))+kv("Antincendio",expiry(d.fire_safety_expires_on))+'</div>'
 +'<h3>Documento d’identità</h3><div class="kvs">'+kv("Tipo",esc(IDT[d.id_doc_type]||""))+kv("Numero",esc(d.id_doc_number))+kv("Rilasciato da",esc(d.id_doc_issued_by))+kv("Rilasciato il",fd(d.id_doc_issued_on))+kv("Scade il",expiry(d.id_doc_expires_on))+'</div>'
 +'<h3>File caricati</h3><div class="dl">'+(docs.map(x=>x.url?'<a href="'+x.url+'" target="_blank" rel="noopener"><span>'+esc(TL[x.type]||x.type)+(x.label?': '+esc(x.label):"")+' <small class="muted">· '+esc(x.name||"")+'</small></span><span>Apri</span></a>':'').join("")||'<p class="muted">Nessun file caricato.</p>')+'</div></div></details>';
}
async function load(){try{$("status").textContent="Caricamento…";const d=await invoke("unit_staff_documents",{unit_id:$("unit").value});$("cvs").innerHTML=(d.people||[]).map(person).join("")||'<p class="muted">Nessuna persona nel reparto.</p>';$("status").textContent="Elenco aggiornato."}catch(e){$("status").textContent=e.message}}
$("load").onclick=load;init();
</script></body></html>
