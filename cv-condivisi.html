function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function invoke(action,extra){const r=await fetch("https://mmkdibdomjaxwqfryqcw.supabase.co/functions/v1/nanoshift-admin",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,apikey:"sb_publishable_QPArC4ARilfFLqxnNsV72A_UBzZN-5g","Content-Type":"application/json"},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||"Errore");return d}
async function initNav(user){try{const nv=await NanoNav.loadContext(sb,user);NanoNav.render({container:$("sideNav"),page:"cvs",prefs:nv.prefs,ctx:nv.ctx,account:{name:nv.profile.display_name||nv.profile.first_name||user.email,avatar:nv.profile.avatar_url,onLogout:async()=>{await sb.auth.signOut();location.href="accesso.html"}}});NanoNav.mountAccount($("headerAccount"),{sb,user,profile:nv.profile})}catch(e){console.error(e)}}
async function init(){const {data:{session:s}}=await sb.auth.getSession();if(!s){location.href="accesso.html";return}session=s;initNav(s.user);const {data,error}=await sb.rpc("get_my_units");if(error){$("status").textContent=error.message;return}const units=(data||[]).filter(x=>x.unit_role==="coordinator"&&x.status==="active");$("unit").innerHTML=units.map(u=>'<option value="'+u.unit_id+'">'+esc(u.unit_name||u.name||"Reparto")+'</option>').join("");if(!units.length){$("status").textContent="Non risulti nel coordinamento di alcun reparto.";return}load()}
async function load(){try{const d=await invoke("list_visible_cvs",{unit_id:$("unit").value});$("cvs").innerHTML=(d.cvs||[]).map(x=>'<div class="item"><b>'+esc(x.name||"Utente")+'</b><p><a href="'+x.url+'" target="_blank" rel="noopener">Apri curriculum</a></p></div>').join("")||'<p class="muted">Nessun CV condiviso per questo reparto.</p>';$("status").textContent="Elenco aggiornato."}catch(e){$("status").textContent=e.message}}
$("load").onclick=load;init();
